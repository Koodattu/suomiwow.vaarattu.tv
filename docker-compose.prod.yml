services:
  mongo:
    image: mongo:7
    container_name: wow-prog-db
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1"]
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try { rs.status(); }
          catch (error) {
            const result = rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
            if (!result.ok && result.codeName !== "AlreadyInitialized") throw result;
          }
        '
        until mongosh --host mongo:27017 --quiet --eval 'if (db.hello().isWritablePrimary) quit(0); quit(1)'; do sleep 1; done
    networks:
      - app-network

  backend:
    build: ./backend
    image: wow-guild-progress-tracker-backend:latest
    container_name: wow-prog-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/wow_guild_tracker?replicaSet=rs0
      - NODE_ENV=production
      - WORKER_MODE=api
      - ICON_CACHE_DIR=/app/data/icons
    # Higher CPU share = OS gives this container priority when CPU is contested
    cpu_shares: 1024
    mem_limit: 1024m
    command: ["node", "--max-old-space-size=384", "dist/index.js"]
    volumes:
      - ./data/icons:/app/data/icons
      - ./backend/logs:/app/logs
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    networks:
      - app-network

  backend-worker:
    image: wow-guild-progress-tracker-backend:latest
    container_name: wow-prog-backend-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/wow_guild_tracker?replicaSet=rs0
      - NODE_ENV=production
      - WORKER_MODE=worker
      - ICON_CACHE_DIR=/app/data/icons
    # Lower CPU share = OS deprioritizes this when API needs CPU
    # nice -n 15 further lowers kernel scheduling priority
    cpu_shares: 256
    mem_limit: 2g
    command:
      ["nice", "-n", "15", "node", "--max-old-space-size=1536", "dist/index.js"]
    volumes:
      - ./data/icons:/app/data/icons
      - ./backend/logs:/app/logs
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=https://suomiwow.vaarattu.tv
    image: wow-guild-progress-tracker-frontend:latest
    container_name: wow-prog-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://suomiwow.vaarattu.tv
      - API_URL=http://backend:3001
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    build: ./nginx
    container_name: wow-prog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/html:/var/www/html
    depends_on:
      - frontend
      - backend
      - backend-worker
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
