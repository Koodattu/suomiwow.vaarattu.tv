<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Raider Constellation</title>
    <style>
      :root {
        --bg: #050711;
        --panel: #0b1020;
        --line: rgba(148, 163, 184, 0.22);
        --line-strong: rgba(148, 163, 184, 0.38);
        --text: #f8fafc;
        --muted: #a5b4c8;
        --quiet: #738196;
        --blue: #60a5fa;
        --blue-strong: #2563eb;
        --amber: #fbbf24;
        --shadow: rgba(0, 0, 0, 0.34);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
      }

      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }

      .app {
        position: relative;
        display: block;
        height: 100vh;
        overflow: hidden;
      }

      .sidebar {
        position: absolute;
        z-index: 4;
        top: 12px;
        left: 12px;
        width: 252px;
        display: grid;
        gap: 8px;
        pointer-events: none;
      }

      .side-section {
        display: grid;
        gap: 9px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(7, 11, 22, 0.72);
        padding: 10px;
        box-shadow: 0 8px 14px var(--shadow);
        backdrop-filter: blur(12px);
        pointer-events: auto;
      }

      .search-island {
        z-index: 5;
      }

      .filter-body {
        display: grid;
        gap: 9px;
      }

      .side-section h3 {
        margin: 0;
        color: var(--quiet);
        font-size: 0.72rem;
        font-weight: 760;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .mode-row {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }

      .mode-row .button {
        font-size: 0.72rem;
        padding: 0 4px;
      }

      .scope-stack {
        display: grid;
        gap: 8px;
      }

      .scope-group {
        display: grid;
        gap: 5px;
      }

      .scope-label {
        color: var(--muted);
        font-size: 0.68rem;
        font-weight: 700;
      }

      .identity-row {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
      }

      .identity-row .button {
        font-size: 0.72rem;
        padding: 0 4px;
      }

      .glink {
        cursor: pointer;
      }

      button.glink {
        appearance: none;
        border: 0;
        background: transparent;
        color: inherit;
        padding: 0;
        font: inherit;
        font-weight: inherit;
      }

      .glink:hover {
        color: var(--blue);
        text-decoration: underline;
      }

      .timeline.dimmed {
        opacity: 0.55;
      }

      .button {
        min-height: 33px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        background: #101827;
        font-size: 0.82rem;
        font-weight: 700;
        cursor: pointer;
      }

      .button:hover {
        border-color: color-mix(in srgb, var(--blue) 54%, var(--line-strong));
        background: #162033;
      }

      .button.active {
        border-color: color-mix(in srgb, var(--blue-strong) 70%, white);
        background: var(--blue-strong);
      }

      .button:disabled,
      .button[aria-disabled="true"] {
        cursor: not-allowed;
        opacity: 0.46;
      }

      .field {
        display: grid;
        gap: 5px;
      }

      .field label {
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 650;
      }

      select,
      input[type="text"] {
        min-height: 32px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        background: #070b16;
        color: var(--text);
        padding: 0 10px;
        outline: none;
        width: 100%;
      }

      select:focus,
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid color-mix(in srgb, var(--blue) 80%, white);
        outline-offset: 1px;
      }

      .toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 32px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #070b16;
        padding: 0 10px;
        color: var(--muted);
        font-size: 0.8rem;
        cursor: pointer;
      }

      .toggle input {
        width: 16px;
        height: 16px;
        accent-color: var(--blue);
      }

      .hidden {
        display: none !important;
      }

      .search-results {
        display: none;
        gap: 5px;
        max-height: 360px;
        overflow: auto;
      }

      .search-results.visible {
        display: grid;
      }

      .search-result {
        border: 1px solid var(--line);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.035);
        padding: 7px 9px;
        text-align: left;
        cursor: pointer;
      }

      .search-result:hover {
        border-color: rgba(96, 165, 250, 0.48);
        background: rgba(37, 99, 235, 0.16);
      }

      .search-kind {
        flex: 0 0 auto;
        border-radius: 999px;
        background: rgba(96, 165, 250, 0.14);
        color: #bfdbfe;
        padding: 1px 6px;
        font-size: 0.6rem;
        font-weight: 760;
      }

      .search-kind.guild {
        background: rgba(251, 191, 36, 0.14);
        color: #fde68a;
      }

      .identity-line {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        min-width: 0;
      }

      .identity-line .name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .realm-inline,
      .realm-muted {
        color: var(--quiet);
        font-size: 0.72em;
        font-weight: 620;
      }

      .realm-muted {
        font-size: 0.96em;
      }

      .class-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .class-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #070b16;
        padding: 3px 8px;
        font-size: 0.68rem;
        color: var(--muted);
        cursor: pointer;
      }

      .class-chip .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
      }

      .class-chip.on {
        border-color: rgba(96, 165, 250, 0.6);
        background: rgba(37, 99, 235, 0.22);
        color: var(--text);
      }

      .hint {
        color: var(--quiet);
        font-size: 0.72rem;
        line-height: 1.55;
      }

      .hint b {
        color: var(--muted);
      }

      .stage {
        position: absolute;
        inset: 0;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 25% 18%, rgba(96, 165, 250, 0.1), transparent 30%),
          radial-gradient(circle at 80% 80%, rgba(167, 139, 250, 0.08), transparent 26%),
          #050711;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .stage-top {
        position: absolute;
        z-index: 3;
        top: 12px;
        left: 276px;
        right: 384px;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        pointer-events: none;
      }

      .stage-title {
        max-width: min(480px, 55vw);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(5, 7, 17, 0.68);
        padding: 10px 13px;
        box-shadow: 0 8px 18px var(--shadow);
        backdrop-filter: blur(12px);
        pointer-events: none;
      }

      .stage-title h2 {
        margin: 0;
        font-size: 1rem;
        font-weight: 800;
      }

      .stage-title p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.78rem;
      }

      .stat-strip {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 7px;
        margin-left: auto;
      }

      .stat {
        min-width: 72px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(5, 7, 17, 0.68);
        padding: 7px 9px;
        backdrop-filter: blur(12px);
      }

      .stat strong {
        display: block;
        font-size: 0.95rem;
        line-height: 1;
      }

      .stat span {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 0.68rem;
      }

      .timeline {
        position: absolute;
        z-index: 3;
        left: 12px;
        right: 12px;
        bottom: 12px;
        display: flex;
        align-items: stretch;
        gap: 4px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: rgba(5, 7, 17, 0.88);
        padding: 7px;
        box-shadow: 0 8px 18px var(--shadow);
      }

      .play-btn {
        flex: 0 0 auto;
        width: 38px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        background: #101827;
        font-size: 0.9rem;
        cursor: pointer;
      }

      .play-btn:hover {
        background: #162033;
      }

      .tier-cells {
        display: flex;
        flex: 1 1 auto;
        gap: 3px;
        min-width: 0;
      }

      .movement-scrubber {
        display: grid;
        grid-template-columns: minmax(110px, 180px) minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 1px 6px;
      }

      .movement-scrubber select {
        width: 100%;
        min-width: 0;
        height: 28px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .movement-scrubber input[type="range"] {
        width: 100%;
        min-width: 0;
        accent-color: var(--blue);
      }

      .movement-scrubber output {
        min-width: 112px;
        color: var(--muted);
        font-size: 0.7rem;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .tier-cell {
        flex: 1 1 0;
        min-width: 0;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        padding: 3px 2px 4px;
        text-align: center;
        cursor: pointer;
      }

      .tier-cell:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .tier-cell.active {
        border-color: rgba(96, 165, 250, 0.55);
        background: rgba(37, 99, 235, 0.22);
      }

      .tier-cell .bar {
        height: 3px;
        border-radius: 99px;
        margin-bottom: 4px;
        opacity: 0.85;
      }

      .tier-cell .abbr {
        display: block;
        font-size: 0.66rem;
        font-weight: 760;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .tier-cell .yr {
        display: block;
        font-size: 0.6rem;
        color: var(--quiet);
      }

      .tooltip {
        position: absolute;
        z-index: 6;
        display: none;
        max-width: 320px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: rgba(7, 11, 22, 0.96);
        padding: 8px 10px;
        font-size: 0.75rem;
        line-height: 1.45;
        color: var(--muted);
        pointer-events: none;
        box-shadow: 0 10px 22px var(--shadow);
      }

      .tooltip b {
        color: var(--text);
      }

      .overlay {
        position: absolute;
        z-index: 5;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(5, 7, 17, 0.78);
        padding: 24px;
      }

      .overlay.visible {
        display: flex;
      }

      .notice {
        width: min(480px, 100%);
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        background: #080d19;
        padding: 16px;
      }

      .notice strong {
        display: block;
        margin-bottom: 6px;
      }

      .notice p {
        margin: 0;
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      .inspector-header {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 15px 16px 12px;
        border-bottom: 1px solid var(--line);
        background: rgba(7, 11, 22, 0.86);
        backdrop-filter: blur(12px);
      }

      .inspector-header h2 {
        margin: 0;
        font-size: 0.92rem;
        font-weight: 780;
      }

      .inspector-header p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 0.77rem;
        line-height: 1.45;
      }

      .inspector-body {
        display: grid;
        align-content: start;
        gap: 13px;
        padding: 13px 16px 20px;
        min-width: 0;
      }

      .panel {
        display: grid;
        gap: 8px;
        min-width: 0;
      }

      .panel h3 {
        margin: 0;
        color: var(--quiet);
        font-size: 0.72rem;
        font-weight: 760;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.035);
        padding: 9px 10px;
        min-width: 0;
      }

      .row-main {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 0.82rem;
        font-weight: 720;
      }

      .row-main span:first-child {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row-sub {
        margin-top: 3px;
        color: var(--quiet);
        font-size: 0.71rem;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }

      .list {
        display: grid;
        gap: 6px;
      }

      button.card {
        width: 100%;
        text-align: left;
        cursor: pointer;
        color: inherit;
      }

      button.card:hover,
      button.card.active {
        border-color: rgba(96, 165, 250, 0.5);
        background: rgba(37, 99, 235, 0.16);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 6px;
      }

      .chip {
        display: inline-flex;
        max-width: 100%;
        align-items: center;
        gap: 5px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #070b16;
        color: var(--muted);
        padding: 2px 8px;
        font-size: 0.68rem;
        cursor: pointer;
      }

      .chip:hover {
        border-color: rgba(96, 165, 250, 0.5);
        color: var(--text);
      }

      .chip.static {
        cursor: default;
      }

      .movement-note {
        color: var(--muted);
        font-size: 0.76rem;
        line-height: 1.5;
      }

      .movement-route-total {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: baseline;
        gap: 4px;
        font-variant-numeric: tabular-nums;
      }

      .movement-route-unit {
        color: var(--quiet);
        font-size: 0.68rem;
        font-weight: 700;
      }

      .movement-route-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 3px 5px;
        font-variant-numeric: tabular-nums;
      }

      .movement-route-separator {
        color: var(--quiet);
      }

      .movement-route-movers {
        gap: 5px;
      }

      .movement-contribution {
        font-variant-numeric: tabular-nums;
        opacity: 0.72;
      }

      .movement-change {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 0.7rem;
        line-height: 1.4;
        padding: 0 6px;
      }

      .movement-change::before {
        content: "↓";
        color: var(--amber);
        font-weight: 800;
      }

      .ambiguous-card {
        border-color: rgba(251, 191, 36, 0.4);
        background: rgba(251, 191, 36, 0.07);
      }

      .char-refs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        margin-top: 6px;
      }

      .char-ref {
        display: inline-flex;
        align-items: center;
        min-width: 0;
        gap: 5px;
        color: var(--muted);
        font-size: 0.72rem;
        line-height: 1.2;
        cursor: pointer;
      }

      .char-ref:hover .char-ref-name {
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .char-ref.static {
        cursor: default;
      }

      .char-ref.static:hover .char-ref-name {
        text-decoration: none;
      }

      .class-icon {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        border-radius: 4px;
        object-fit: cover;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14);
      }

      .char-ref-name {
        display: inline-flex;
        align-items: baseline;
        min-width: 0;
        gap: 5px;
        font-weight: 780;
      }

      .char-ref-name .name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .char-ref-meta,
      .char-more {
        color: var(--quiet);
        font-size: 0.68rem;
        font-weight: 700;
      }

      .roster-bars {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 46px;
        margin-top: 6px;
      }

      .roster-bars button {
        flex: 1 1 0;
        min-width: 2px;
        border: none;
        border-radius: 2px 2px 0 0;
        padding: 0;
        cursor: pointer;
        opacity: 0.55;
      }

      .roster-bars button.on {
        opacity: 1;
        outline: 1px solid rgba(255, 255, 255, 0.6);
      }

      .clear-row {
        display: flex;
        gap: 8px;
      }

      .clear-row .button {
        flex: 1;
        font-size: 0.76rem;
        min-height: 29px;
      }

      .inspector {
        position: absolute;
        z-index: 5;
        top: 12px;
        right: 12px;
        bottom: 70px;
        width: min(360px, calc(100vw - 48px));
        min-height: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(7, 11, 22, 0.78);
        box-shadow: 0 12px 22px var(--shadow);
        backdrop-filter: blur(14px);
        overflow-y: auto;
      }

      @media (max-width: 1180px) {
        .sidebar {
          width: 232px;
        }

        .stage-top {
          left: 256px;
          right: 372px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="side-section view-island">
          <h3 id="viewHeading"></h3>
          <div class="scope-stack">
            <div class="scope-group">
              <span class="scope-label" id="selectedRaidLabel"></span>
              <div class="mode-row">
                <button class="button active" id="modeGalaxy" type="button" aria-pressed="true"></button>
                <button class="button" id="modeMovement" type="button" aria-pressed="false"></button>
              </div>
            </div>
            <div class="scope-group">
              <span class="scope-label" id="allRaidsLabel"></span>
              <div class="mode-row">
                <button class="button" id="modeAll" type="button" aria-pressed="false"></button>
                <button class="button" id="modeFlow" type="button" aria-pressed="false"></button>
              </div>
            </div>
          </div>
          <div class="identity-row">
            <button class="button active" id="identityCharacter" type="button" aria-pressed="true"></button>
            <button class="button" id="identityAccount" type="button" aria-pressed="false"></button>
          </div>
        </div>

        <div class="side-section filters-island">
          <h3 id="filtersHeading"></h3>
          <div class="filter-body">
            <div class="field">
              <label for="minReports" id="minReportsLabel"></label>
              <select id="minReports">
                <option value="1"></option>
                <option value="2" selected></option>
                <option value="3"></option>
                <option value="5"></option>
                <option value="10"></option>
              </select>
            </div>
            <label class="toggle" id="flowsToggle"><span id="flowsLabel"></span><input id="tglFlows" type="checkbox" checked /></label>
            <label class="toggle" id="trailsToggle"><span id="trailsLabel"></span><input id="tglTrails" type="checkbox" /></label>
            <label class="toggle" id="fibersToggle"><span id="fibersLabel"></span><input id="tglFibers" type="checkbox" /></label>
            <label class="toggle"><span id="labelsLabel"></span><input id="tglLabels" type="checkbox" checked /></label>
            <div class="clear-row">
              <button class="button" id="resetView" type="button"></button>
              <button class="button" id="clearSel" type="button"></button>
            </div>
          </div>
        </div>

        <div class="side-section search-island">
          <h3 id="searchHeading"></h3>
          <input id="search" type="text" autocomplete="off" spellcheck="false" />
          <div class="search-results" id="searchResults"></div>
        </div>
      </aside>

      <main class="stage" id="stage">
        <canvas id="canvas" role="img"></canvas>
        <div class="stage-top">
          <div class="stage-title">
            <h2 id="titleMain">Loading…</h2>
            <p id="titleSub"></p>
          </div>
          <div class="stat-strip" id="stats"></div>
        </div>
        <div class="timeline" id="timeline" style="display: none">
          <button class="play-btn" id="playBtn" type="button">▶</button>
          <div class="tier-cells" id="tierCells"></div>
        </div>
        <div class="tooltip" id="tooltip"></div>
        <div class="overlay visible" id="loading">
          <div class="notice">
            <strong id="loadingTitle"></strong>
            <p id="loadingText"></p>

      /* ============================== helpers ============================== */

      const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[m]);

      function hash32(str) {
        let h = 0x811c9dc5;

      const RAID_ABBRS = {

      const SEARCH_CHAR_MAP = {

      function normalizeSearch(value) {
        return String(value || "")
          .replace(/[æœøØđĐðÐþÞłŁß]/g, (ch) => SEARCH_CHAR_MAP[ch] || ch)
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, " ")

      function hullRadius(n) {
        return DOT_SPACING * Math.sqrt(Math.max(1, n)) + HULL_PAD;
      }

      // phyllotaxis slot offsets, lazily extended
      let phX = new Float32Array(0);
      let phY = new Float32Array(0);
      function ensurePhyllo(n) {
        if (phX.length >= n) return;
        const size = Math.max(n, 1024);
        const nx = new Float32Array(size);
        const ny = new Float32Array(size);
        nx.set(phX); ny.set(phY);
        for (let i = phX.length; i < size; i += 1) {
          const r = DOT_SPACING * Math.sqrt(i + 0.6);
          nx[i] = Math.cos(i * PHYLLO_ANGLE) * r;
          ny[i] = Math.sin(i * PHYLLO_ANGLE) * r;
        }
        phX = nx; phY = ny;
      }

      /* ============================== data load ============================== */

      function buildAccountEntities() {
        if (M.accountChars) return M.accountChars;

        const groupedMembers = new Set();
        const accounts = [];
        for (const group of M.accountGroups) {
          const members = group.members.filter((c) => M.baseChars[c]);
          if (members.length < 2) continue;
          for (const c of members) groupedMembers.add(c);

          const memTotals = new Map();
          const tierMemberReports = Array.from({ length: M.tiers.length }, () => new Map());
          const classTotals = new Map();
          const aliasParts = new Set([group.name, group.slug || ""]);
          let total = 0;

          for (const c of members) {
            const ch = M.baseChars[c];
            aliasParts.add(ch.name);
            aliasParts.add(ch.realm);
            for (const alias of ch.aliases || []) aliasParts.add(alias);
            for (let i = 0; i < ch.mem.length; i += 3) {
              const t = ch.mem[i];
              const g = ch.mem[i + 1];
              const r = ch.mem[i + 2];
              const key = t * 100000 + g;
              memTotals.set(key, (memTotals.get(key) || 0) + r);
              tierMemberReports[t].set(c, (tierMemberReports[t].get(c) || 0) + r);
              classTotals.set(ch.classID, (classTotals.get(ch.classID) || 0) + r);
              total += r;
            }
          }

          const tierPersona = {};
          let primaryIndex = members[0];
          let primaryReports = -1;
          for (let t = 0; t < tierMemberReports.length; t += 1) {
            let best = -1;
            let bestReports = -1;
            for (const [c, reports] of tierMemberReports[t]) {
              const ch = M.baseChars[c];
              if (reports > bestReports || (reports === bestReports && ch.total > (M.baseChars[best]?.total || 0))) {
                best = c;
                bestReports = reports;
              }
            }
            if (best >= 0) {
              const ch = M.baseChars[best];
              tierPersona[t] = { name: ch.name, realm: ch.realm, classID: ch.classID, charIndex: best, reports: bestReports };
              if (bestReports >= primaryReports) {
                primaryIndex = best;
                primaryReports = bestReports;
              }
            }
          }

          const primary = M.baseChars[primaryIndex] || M.baseChars[members[0]];
          const classID = Array.from(classTotals.entries()).sort((a, b) => b[1] - a[1])[0]?.[0] || primary.classID || 0;
          const keys = Array.from(memTotals.keys()).sort((a, b) => a - b);
          const mem = [];
          for (const key of keys) mem.push(Math.floor(key / 100000), key % 100000, memTotals.get(key) || 0);

          accounts.push({
            name: group.name || primary.name,
            realm: primary.realm,
            classID: CLASS_NAMES[classID] ? classID : 0,
            mem,
            aliases: Array.from(aliasParts).filter(Boolean),
            searchKey: normalizeSearch(Array.from(aliasParts).join(" ")),
            nameKey: normalizeSearch(group.name || primary.name),
            duplicateName: false,
            total,
            isAccount: true,
            accountSlug: group.slug,
            memberIndexes: members,
            tierPersona,
          });
        }

        for (let c = 0; c < M.baseChars.length; c += 1) {
          if (groupedMembers.has(c)) continue;
          const ch = M.baseChars[c];
          accounts.push({
            ...ch,
            isAccount: false,
            memberIndexes: [c],
            sourceChar: c,
            tierPersona: {},
          });
        }

        computeDuplicateNames(accounts);
        M.accountChars = accounts;
        return accounts;
      }

      async function boot() {
        try {
          els.loadingTitle.textContent = networkCopy.loadingUniverseTitle;
          els.loadingText.textContent = networkCopy.loadingUniverseBody;
          const params = new URLSearchParams(window.location.search);
          const universeUrl = params.get("universe") || "/api/guild-network/universe";
          const controller = new AbortController();
          universeController = controller;
          const res = await fetch(universeUrl, { cache: "force-cache", signal: controller.signal });
          const data = await res.json();
          if (destroyed) return;
          if (!res.ok) throw new Error(data.error || "universe request failed");

          M.tiers = data.tiers;
          M.realms = data.realms;
          M.guilds = data.guilds.map(([name, realmIdx], g) => ({
            key: Array.isArray(data.guildKeys) ? data.guildKeys[g] || "" : "",
            name,
            realm: M.realms[realmIdx] || "Unknown",
            hue: hash32(name + "::" + g) % 360,
            searchKey: normalizeSearch(`${name} ${M.realms[realmIdx] || "Unknown"}`),
            nameKey: normalizeSearch(name),
            duplicateName: false,
          }));
          const guildNameCounts = new Map();
          for (const guild of M.guilds) guildNameCounts.set(guild.nameKey, (guildNameCounts.get(guild.nameKey) || 0) + 1);
          for (const guild of M.guilds) guild.duplicateName = (guildNameCounts.get(guild.nameKey) || 0) > 1;
          M.guildIndexByKey = new Map();
          M.guilds.forEach((guild, index) => {
            if (guild.key) M.guildIndexByKey.set(guild.key, index);
            M.guildIndexByKey.set(`label:${normalizeSearch(guild.name)}:${normalizeSearch(guild.realm)}`, index);
          });

          M.baseChars = data.characters.map(([name, realmIdx, classID, mem, aliases]) => {
            const realm = M.realms[realmIdx] || "Unknown";
            const aliasText = Array.isArray(aliases) ? aliases.join(" ") : "";
            return {
              name,
              realm,
              classID: CLASS_NAMES[classID] ? classID : 0,
              mem, // flat [t, g, reports, ...]
              aliases: Array.isArray(aliases) ? aliases : [],
              searchKey: normalizeSearch(`${name} ${realm} ${aliasText}`),
              nameKey: normalizeSearch(name),
              duplicateName: false,
              total: (() => { let s = 0; for (let i = 2; i < mem.length; i += 3) s += mem[i]; return s; })(),
            };
          });
          computeDuplicateNames(M.baseChars);
          M.accountGroups = (Array.isArray(data.accounts) ? data.accounts : [])
            .map(([name, slug, members]) => ({
              name: name || "Account",
              slug: slug || null,
              members: Array.isArray(members) ? members.filter((c) => Number.isInteger(c) && c >= 0 && c < M.baseChars.length) : [],
            }))
            .filter((group) => group.members.length >= 2);
          M.accountChars = null;
          M.chars = M.baseChars;
          updateIdentityButtons();

          els.loadingText.textContent = networkCopy.loadingLayout;
          await delay(30); // let the text paint
          if (destroyed) return;

          view.tier = M.tiers.length - 1;
          rebuild();
          buildClassGrid();
          buildTimeline();
          fitGalaxy();
          els.loading.classList.remove("visible");
          els.timeline.style.display = "flex";
          updateHud();
          renderInspector();
          frameId = requestAnimationFrame(frame);
        } catch (err) {
          if (destroyed || (err instanceof DOMException && err.name === "AbortError")) return;
          els.loading.classList.remove("visible");
          els.errorText.textContent = err instanceof Error ? err.message : networkCopy.shellLoadError;
          els.errorBox.classList.add("visible");
        } finally {
          universeController = null;
        }
      }

      /* ============================== selected-raid movement ============================== */

      function movementRequestUrl(raidId) {
        return movementUrlTemplate.replace("{raidId}", encodeURIComponent(String(raidId)));
      }

      function movementCharacterLabel(model, characterIndex, full = false) {
        const character = model.characters[characterIndex];
        if (!character) return "Unknown";
        return full ? `${character.name}-${realmLabel(character.realm)}` : character.name;
      }

      function registerMovementGuild(key, name, realm) {
        const normalizedName = normalizeSearch(name);
        const normalizedRealm = normalizeSearch(realm);
        const labelKey = `label:${normalizedName}:${normalizedRealm}`;
        const existing = M.guildIndexByKey.get(String(key)) ?? M.guildIndexByKey.get(labelKey);
        if (existing !== undefined) return existing;

        const g = M.guilds.length;
        const guild = {
          key: String(key),
          name: String(name || "Unknown"),
          realm: String(realm || "Unknown"),
          hue: hash32(`${name}::${key}`) % 360,
          searchKey: normalizeSearch(`${name} ${realm}`),
          nameKey: normalizedName,
          duplicateName: false,
        };
        M.guilds.push(guild);
        M.guildIndexByKey.set(guild.key, g);
        M.guildIndexByKey.set(labelKey, g);

        const matchingNames = M.guilds.filter((candidate) => candidate.nameKey === guild.nameKey);
        if (matchingNames.length > 1) {
          for (const candidate of matchingNames) candidate.duplicateName = true;
        }
        return g;
      }

      function parseMovementPayload(data) {
        const guilds = (Array.isArray(data.guilds) ? data.guilds : []).map(([key, name, realm]) => {
          return {
            key: String(key),
            name: String(name || "Unknown"),
            realm: String(realm || "Unknown"),
            g: registerMovementGuild(key, name, realm),
          };
        });
        const characters = (Array.isArray(data.characters) ? data.characters : []).map(([key, name, realm, classID, aliases]) => ({
          key: String(key),
          name: String(name || "Unknown"),
          realm: String(realm || "Unknown"),
          classID: CLASS_NAMES[classID] ? classID : 0,
          aliases: Array.isArray(aliases) ? aliases : [],
        }));
        const reports = [];
        const observationsByCharacter = Array.from({ length: characters.length }, () => []);
        for (const tuple of Array.isArray(data.reports) ? data.reports : []) {
          const [code, startTime, endTime, guildIndex, characterIndexes] = tuple;
          const guild = guilds[guildIndex];
          if (!guild || !Number.isFinite(startTime)) continue;
          const report = {
            code: String(code),
            time: Number(startTime),
            end: Number.isFinite(endTime) ? Number(endTime) : Number(startTime),
            g: guild.g,
          };
          reports.push(report);
          for (const characterIndex of Array.isArray(characterIndexes) ? characterIndexes : []) {
            if (!observationsByCharacter[characterIndex]) continue;
            observationsByCharacter[characterIndex].push({
              ...report,
              altIndexes: [characterIndex],
            });
          }
        }
        reports.sort((a, b) => a.time - b.time || a.code.localeCompare(b.code));
        for (const observations of observationsByCharacter) observations.sort((a, b) => a.time - b.time || a.code.localeCompare(b.code));

        const accountGroups = (Array.isArray(data.accounts) ? data.accounts : [])
          .map(([name, slug, memberIndexes]) => ({
            name: String(name || "Account"),
            slug: slug ? String(slug) : null,
            members: Array.from(new Set((Array.isArray(memberIndexes) ? memberIndexes : []).filter((index) => observationsByCharacter[index]))),
          }))
          .filter((group) => group.members.length > 0);

        return {
          raid: data.raid,
          guilds,
          characters,
          reports,
          observationsByCharacter,
          accountGroups,
          derived: new Map(),
        };
      }

      function buildMovementEntities(model, identity) {
        if (identity === "character") {
          return model.characters.map((character, characterIndex) => ({
            key: character.key,
            name: character.name,
            realm: character.realm,
            classID: character.classID,
            memberIndexes: [characterIndex],
            observations: model.observationsByCharacter[characterIndex],
            isAccount: false,
            searchKey: normalizeSearch(`${character.name} ${character.realm} ${(character.aliases || []).join(" ")}`),
          }));
        }

        const grouped = new Set();
        const entities = [];
        for (const group of model.accountGroups) {
          for (const member of group.members) grouped.add(member);
          const byReport = new Map();
          for (const member of group.members) {
            for (const observation of model.observationsByCharacter[member]) {
              const key = `${observation.code}\u0000${observation.g}`;
              let merged = byReport.get(key);
              if (!merged) {
                merged = { ...observation, altIndexes: [] };
                byReport.set(key, merged);
              }
              if (!merged.altIndexes.includes(member)) merged.altIndexes.push(member);
            }
          }
          const observations = Array.from(byReport.values()).sort((a, b) => a.time - b.time || a.code.localeCompare(b.code));
          entities.push({
            key: `account:${group.slug || group.name}`,
            name: group.name,
            realm: "",
            classID: 0,
            memberIndexes: group.members,
            observations,
            isAccount: true,
            searchKey: normalizeSearch(`${group.name} ${group.slug || ""} ${group.members.map((member) => movementCharacterLabel(model, member, true)).join(" ")}`),
          });
        }
        for (let characterIndex = 0; characterIndex < model.characters.length; characterIndex += 1) {
          if (grouped.has(characterIndex)) continue;
          const character = model.characters[characterIndex];
          entities.push({
            key: `singleton:${character.key}`,
            name: character.name,
            realm: character.realm,
            classID: character.classID,
            memberIndexes: [characterIndex],
            observations: model.observationsByCharacter[characterIndex],
            isAccount: false,
            searchKey: normalizeSearch(`${character.name} ${character.realm} ${(character.aliases || []).join(" ")}`),
          });
        }
        return entities;
      }

      function reduceMovementEntity(entity, minimumReports) {
        const stints = [];
        const ambiguous = [];
        const sequence = [];
        const transitions = [];
        let current = null;

        for (let index = 0; index < entity.observations.length; ) {
          const time = entity.observations[index].time;
          const atTime = [];
          let next = index;
          while (next < entity.observations.length && entity.observations[next].time === time) {
            atTime.push(entity.observations[next]);
            next += 1;
          }
          const byGuild = new Map();
          for (const observation of atTime) {
            let entry = byGuild.get(observation.g);
            if (!entry) {
              entry = { g: observation.g, observations: [], altIndexes: new Set() };
              byGuild.set(observation.g, entry);
            }
            entry.observations.push(observation);
            for (const alt of observation.altIndexes) entry.altIndexes.add(alt);
          }

          if (byGuild.size > 1) {
            const event = {
              kind: "ambiguous",
              start: time,
              end: Math.max(...atTime.map((observation) => observation.end)),
              guilds: Array.from(byGuild.values()).map((entry) => ({
                g: entry.g,
                reportCount: entry.observations.length,
                observations: entry.observations,
                altIndexes: Array.from(entry.altIndexes),
              })),
            };
            ambiguous.push(event);
            sequence.push(event);
            current = null;
          } else {
            const entry = byGuild.values().next().value;
            if (current && current.g === entry.g) {
              current.end = Math.max(current.end, ...entry.observations.map((observation) => observation.end));
              current.observations.push(...entry.observations);
              for (const alt of entry.altIndexes) current.altIndexes.add(alt);
              current.reportCount = current.observations.length;
            } else {
              const previous = current;
              current = {
                kind: "stint",
                index: stints.length,
                g: entry.g,
                start: time,
                end: Math.max(...entry.observations.map((observation) => observation.end)),
                reportCount: entry.observations.length,
                observations: entry.observations.slice(),
                altIndexes: new Set(entry.altIndexes),
              };
              stints.push(current);
              sequence.push(current);
              if (previous) {
                transitions.push({
                  from: previous,
                  to: current,
                  time,
                  altIndexes: Array.from(entry.altIndexes),
                });
              }
            }
          }
          index = next;
        }

        const keptStints = new Set(stints.filter((stint) => stint.reportCount >= minimumReports));
        const visibleSequence = sequence
          .map((item) => {
            if (item.kind === "stint") return keptStints.has(item) ? item : null;
            const guilds = item.guilds.filter((entry) => entry.reportCount >= minimumReports);
            return guilds.length ? { ...item, guilds } : null;
          })
          .filter(Boolean);
        const visibleTransitions = transitions.filter((transition) => keptStints.has(transition.from) && keptStints.has(transition.to));
        return {
          entity,
          stints,
          ambiguous,
          sequence,
          transitions,
          visibleSequence,
          visibleTransitions,
        };
      }

      function practicalMovementBuckets(reports) {
        const days = [];
        let day = "";
        for (const report of reports) {
          const nextDay = new Date(report.time).toISOString().slice(0, 10);
          if (nextDay === day) {
            days[days.length - 1] = report.time;
          } else {
            day = nextDay;
            days.push(report.time);
          }
        }
        if (days.length <= 36) return days;
        const sampled = [];
        for (let index = 0; index < 36; index += 1) {
          const source = Math.round((index / 35) * (days.length - 1));
          if (sampled[sampled.length - 1] !== days[source]) sampled.push(days[source]);
        }
        return sampled;
      }

      function buildMovementGuildPositions(model) {
        if (model.guildPositions) return model.guildPositions;
        const positions = new Map();
        const anchored = [];
        const fallback = Array.from(new Set(model.guilds.map((guild) => guild.g)))
          .filter((g) => g >= 0)
          .sort((a, b) => (M.guilds[a]?.key || "").localeCompare(M.guilds[b]?.key || ""));

        for (let index = fallback.length - 1; index >= 0; index -= 1) {
          const g = fallback[index];
          const x = Number(F.gx?.[g]);
          const y = Number(F.gy?.[g]);
          if ((F.guildMax?.[g] || 0) > 0 && Number.isFinite(x) && Number.isFinite(y)) {
            positions.set(g, { x, y });
            anchored.push({ x, y });
            fallback.splice(index, 1);
          }
        }

        if (fallback.length) {
          const center = anchored.length
            ? {
                x: anchored.reduce((sum, point) => sum + point.x, 0) / anchored.length,
                y: anchored.reduce((sum, point) => sum + point.y, 0) / anchored.length,
              }
            : { x: 0, y: 0 };
          const furthestAnchor = anchored.reduce(
            (furthest, point) => Math.max(furthest, Math.hypot(point.x - center.x, point.y - center.y)),
            0,
          );
          const radius = anchored.length
            ? Math.max(240, furthestAnchor + 220, fallback.length * 55)
            : fallback.length === 1
              ? 0
              : Math.max(180, fallback.length * 48);
          const startAngle = ((hash32(`movement:${model.raid?.id || 0}`) % 6283) / 1000) - Math.PI;
          fallback.forEach((g, index) => {
            const angle = startAngle + (index / Math.max(1, fallback.length)) * Math.PI * 2;
            positions.set(g, {
              x: center.x + Math.cos(angle) * radius,
              y: center.y + Math.sin(angle) * radius,
            });
          });
        }

        model.guildPositions = positions;
        return positions;
      }

      function movementGuildPoint(derived, g) {
        return derived?.guildPositions?.get(g) || { x: Number(F.gx?.[g]) || 0, y: Number(F.gy?.[g]) || 0 };
      }

      function movementGuildLayout(positions) {
        const layout = { gx: [], gy: [] };
        for (const [g, point] of positions) {
          layout.gx[g] = point.x;
          layout.gy[g] = point.y;
        }
        return layout;
      }

      function buildMovementDerived(model) {
        const key = `${view.identity}:${view.movementMinReports}`;
        const cached = model.derived.get(key);
        if (cached) return cached;
        const entities = buildMovementEntities(model, view.identity);
        const timelines = entities.map((entity) => reduceMovementEntity(entity, view.movementMinReports));
        const guildPositions = buildMovementGuildPositions(model);
        const derived = {
          model,
          entities,
          timelines,
          buckets: practicalMovementBuckets(model.reports),
          guildPositions,
          guildLayout: movementGuildLayout(guildPositions),
          frame: null,
        };
        model.derived.set(key, derived);
        return derived;
      }

      function latestMovementObservation(item, cutoff) {
        if (item.kind === "ambiguous") {
          const observations = item.guilds.flatMap((entry) => entry.observations).filter((observation) => observation.time <= cutoff);
          return observations.sort((a, b) => b.time - a.time || b.code.localeCompare(a.code))[0] || null;
        }
        const observations = item.observations.filter((observation) => observation.time <= cutoff);
        return observations[observations.length - 1] || null;
      }

      function movementItemReportCount(item, cutoff) {
        if (item.kind === "ambiguous") {
          return item.guilds.reduce(
            (sum, guild) => sum + guild.observations.filter((observation) => observation.time <= cutoff).length,
            0,
          );
        }
        return item.observations.filter((observation) => observation.time <= cutoff).length;
      }

      function buildMovementFrame(derived) {
        const cutoff = derived.buckets.length && view.movementStep >= 0
          ? derived.buckets[clamp(view.movementStep, 0, derived.buckets.length - 1)]
          : Number.POSITIVE_INFINITY;
        const nodes = [];
        const roster = new Map();
        const guildActivity = new Map();
        const flows = new Map();
        const activeEntities = [];
        const guildsSeen = new Set();
        let observations = 0;
        let multiGuild = 0;
        let changes = 0;

        derived.timelines.forEach((timeline, entityIndex) => {
          const visible = timeline.visibleSequence.filter((item) => item.start <= cutoff);
          if (!visible.length) return;
          const latest = visible[visible.length - 1];
          const distinctGuilds = new Set();
          for (const item of visible) {
            if (item.kind === "stint") {
              distinctGuilds.add(item.g);
              observations += item.observations.filter((observation) => observation.time <= cutoff).length;
            } else {
              for (const guild of item.guilds) {
                distinctGuilds.add(guild.g);
                observations += guild.observations.filter((observation) => observation.time <= cutoff).length;
              }
            }
          }
          if (distinctGuilds.size > 1) multiGuild += 1;
          for (const g of distinctGuilds) {
            guildsSeen.add(g);
            guildActivity.set(g, (guildActivity.get(g) || 0) + 1);
          }

          for (const transition of timeline.visibleTransitions) {
            if (transition.time > cutoff) continue;
            const key = `${transition.from.g}:${transition.to.g}`;
            let flow = flows.get(key);
            if (!flow) {
              flow = { a: transition.from.g, b: transition.to.g, n: 0, contributors: new Map() };
              flows.set(key, flow);
            }
            flow.n += 1;
            let contributor = flow.contributors.get(entityIndex);
            if (!contributor) {
              contributor = { count: 0, altCounts: new Map() };
              flow.contributors.set(entityIndex, contributor);
            }
            contributor.count += 1;
            for (const altIndex of transition.altIndexes || []) {
              contributor.altCounts.set(altIndex, (contributor.altCounts.get(altIndex) || 0) + 1);
            }
            changes += 1;
          }

          const observation = latestMovementObservation(latest, cutoff);
          const altIndex = observation?.altIndexes?.[0] ?? derived.entities[entityIndex].memberIndexes[0];
          const classID = derived.model.characters[altIndex]?.classID || derived.entities[entityIndex].classID || 0;
          const guildList = latest.kind === "stint" ? [latest.g] : latest.guilds.map((entry) => entry.g);
          const g = latest.kind === "stint" ? latest.g : -1;
          if (g >= 0) roster.set(g, (roster.get(g) || 0) + 1);
          else for (const guild of guildList) roster.set(guild, (roster.get(guild) || 0) + 1);
          activeEntities.push(entityIndex);
          nodes.push({
            entityIndex,
            g,
            guilds: guildList,
            x: 0,
            y: 0,
            classID,
            latest,
            latestReportCount: movementItemReportCount(latest, cutoff),
            observation,
          });
        });

        const members = new Map();
        for (const node of nodes) {
          if (node.g < 0) continue;
          const list = members.get(node.g) || [];
          list.push(node);
          members.set(node.g, list);
        }
        for (const [g, guildNodes] of members) {
          const guildPoint = movementGuildPoint(derived, g);
          guildNodes.sort((a, b) => hash32(derived.entities[a.entityIndex].key) - hash32(derived.entities[b.entityIndex].key));
          ensurePhyllo(guildNodes.length);
          guildNodes.forEach((node, index) => {
            node.x = guildPoint.x + phX[index];
            node.y = guildPoint.y + phY[index];
          });
        }
        for (const node of nodes) {
          if (node.g >= 0) continue;
          let x = 0;
          let y = 0;
          for (const g of node.guilds) {
            const point = movementGuildPoint(derived, g);
            x += point.x;
            y += point.y;
          }
          const count = Math.max(1, node.guilds.length);
          const angle = (hash32(derived.entities[node.entityIndex].key) % 6283) / 1000;
          node.x = x / count + Math.cos(angle) * 8;
          node.y = y / count + Math.sin(angle) * 8;
        }

        const nodeByEntity = new Map(nodes.map((node) => [node.entityIndex, node]));
        const frame = {
          cutoff,
          nodes,
          nodeByEntity,
          roster,
          guildActivity,
          flows: Array.from(flows.values()),
          metrics: {
            entities: activeEntities.length,
            guilds: guildsSeen.size,
            multiGuild,
            changes,
            observations,
          },
          grid: null,
        };
        derived.frame = frame;
        return frame;
      }

      function activateMovementModel(model, resetStep = false) {
        const derived = buildMovementDerived(model);
        M.movementCurrent = derived;
        if (resetStep || view.movementStep < 0) view.movementStep = Math.max(0, derived.buckets.length - 1);
        else view.movementStep = clamp(view.movementStep, 0, Math.max(0, derived.buckets.length - 1));
        buildMovementFrame(derived);
        view.fitted.movement = false;
        buildTimeline();
        fitMovement();
        updateHud();
        renderInspector();
        runSearch();
      }

      async function loadMovementForTier(tierIndex, resetStep = true) {
        const tier = M.tiers[tierIndex];
        if (!tier) return;
        if (movementController) {
          movementController.abort();
          movementController = null;
        }
        const cached = M.movement.get(tier.id);
        if (cached) {
          activateMovementModel(cached, resetStep);
          return;
        }

        const controller = new AbortController();
        movementController = controller;
        els.loadingTitle.textContent = networkCopy.loadingMovementTitle;
        els.loadingText.textContent = networkCopy.loadingMovementBody;
        els.loading.classList.add("visible");
        try {
          const response = await fetch(movementRequestUrl(tier.id), { cache: "force-cache", signal: controller.signal });
          const data = await response.json();
          if (!response.ok) throw new Error(networkCopy.movementLoadError);
          const model = parseMovementPayload(data);
          M.movement.set(tier.id, model);
          if (destroyed || view.mode !== "movement" || view.tier !== tierIndex) return;
          activateMovementModel(model, resetStep);
        } catch (error) {
          if (destroyed || controller.signal.aborted) return;
          M.movementCurrent = { error: networkCopy.movementLoadError, buckets: [], frame: null, timelines: [], entities: [] };
          buildTimeline();
          updateHud();
          renderInspector();
        } finally {
          if (movementController === controller) movementController = null;
          if (!destroyed && view.mode === "movement" && view.tier === tierIndex) els.loading.classList.remove("visible");
        }
      }

      function setMovementStep(step) {
        const derived = M.movementCurrent;
        if (!derived || derived.error || !derived.buckets.length) return;
        view.movementStep = clamp(step, 0, derived.buckets.length - 1);
        buildMovementFrame(derived);
        renderTimeline();
        updateHud();
        renderInspector();
      }

      /* ============================== rebuild (filter → layout → tiers → flows) ============================== */

      function rebuild() {
        const TC = M.tiers.length;
        const CC = M.chars.length;
        const GC = M.guilds.length;
        const mr = view.minReports;

        // -- pass 1: per-tier presence with primary guild, secondaries, career guild pairs
        const tierChars = Array.from({ length: TC }, () => []); // [c, g, r] triples
        const tierSecondaries = Array.from({ length: TC }, () => []);
        const pairW = new Map();
        const charTiers = new Array(CC).fill(null);
        const charMovementTiers = new Array(CC).fill(null);
        const firstTier = new Int32Array(CC).fill(-1);
        const firstMovementTierByChar = new Int32Array(CC).fill(-1);
        const movementTiers = [];
        const prevMovementTier = new Int32Array(TC).fill(-1);
        const nextMovementTier = new Int32Array(TC).fill(-1);

        let previousMovementTier = -1;
        for (let t = 0; t < TC; t += 1) {
          prevMovementTier[t] = previousMovementTier;
          if (!isMovementIgnoredTier(t)) {
            movementTiers.push(t);
            previousMovementTier = t;
          }
        }
        let followingMovementTier = -1;
        for (let t = TC - 1; t >= 0; t -= 1) {
          nextMovementTier[t] = followingMovementTier;
          if (!isMovementIgnoredTier(t)) followingMovementTier = t;
        }

        for (let c = 0; c < CC; c += 1) {
          const mem = M.chars[c].mem;
          const careerGuilds = [];
          for (let i = 0; i < mem.length; ) {
            const t = mem[i];
            let best = -1;
            let bestR = 0;
            let j = i;
            const entries = [];
            for (; j < mem.length && mem[j] === t; j += 3) {
              const g = mem[j + 1];
              const r = mem[j + 2];
              if (r >= mr) {
                entries.push(g, r);
                if (r > bestR || (r === bestR && g < best)) { best = g; bestR = r; }
              }
            }
            if (entries.length) {
              tierChars[t].push(c, best, bestR);
              for (let k = 0; k < entries.length; k += 2) {
                const g = entries[k];
                if (g !== best) tierSecondaries[t].push(c, g);
                if (!isMovementIgnoredTier(t) && !careerGuilds.includes(g)) careerGuilds.push(g);
              }
              (charTiers[c] || (charTiers[c] = [])).push(t);
              if (firstTier[c] === -1) firstTier[c] = t;
              if (!isMovementIgnoredTier(t)) {
                (charMovementTiers[c] || (charMovementTiers[c] = [])).push(t);
                if (firstMovementTierByChar[c] === -1) firstMovementTierByChar[c] = t;
              }
            }
            i = j;
          }
          for (let a = 0; a < careerGuilds.length; a += 1) {
            for (let b = a + 1; b < careerGuilds.length; b += 1) {
              const lo = Math.min(careerGuilds[a], careerGuilds[b]);
              const hi = Math.max(careerGuilds[a], careerGuilds[b]);
              const key = lo * 100000 + hi;
              pairW.set(key, (pairW.get(key) || 0) + 1);
            }
          }
        }

        // -- pass 2: rosters and the maximum roster a guild ever fields (sizes its gravity well)
        const guildMax = new Int32Array(GC);
        const rosters = Array.from({ length: TC }, () => new Map()); // g -> count
        for (let t = 0; t < TC; t += 1) {
          const arr = tierChars[t];
          const roster = rosters[t];
          for (let i = 0; i < arr.length; i += 3) {
            roster.set(arr[i + 1], (roster.get(arr[i + 1]) || 0) + 1);
          }
          for (const [g, n] of roster) if (n > guildMax[g]) guildMax[g] = n;
        }
        const active = [];
        for (let g = 0; g < GC; g += 1) if (guildMax[g] > 0) active.push(g);

        // -- guild constellation layout: force sim over the career-overlap meta-graph.
        // Guilds that ever exchanged players end up adjacent, so migrations are short
        // hops and community structure becomes geography. Positions are stable across
        // the whole timeline.
        const gx = new Float32Array(GC);
        const gy = new Float32Array(GC);
        const gr = new Float32Array(GC);
        for (const g of active) gr[g] = hullRadius(guildMax[g]) + 16;

        const order = active.slice().sort((a, b) => guildMax[b] - guildMax[a] || a - b);
        order.forEach((g, i) => {
          const r = 90 * Math.sqrt(i + 0.5);
          gx[g] = Math.cos(i * PHYLLO_ANGLE) * r;
          gy[g] = Math.sin(i * PHYLLO_ANGLE) * r;
        });

        const edges = [];
        for (const [key, w] of pairW) {
          edges.push([Math.floor(key / 100000), key % 100000, w]);
        }

        const ITERS = 420;
        for (let iter = 0; iter < ITERS; iter += 1) {
          const temp = 1 - (iter / ITERS) * 0.75;
          for (const [a, b, w] of edges) {
            const dx = gx[b] - gx[a];
            const dy = gy[b] - gy[a];
            const d = Math.max(1, Math.hypot(dx, dy));
            const ideal = gr[a] + gr[b] + 60;
            const strength = 0.004 * Math.min(1, Math.log1p(w) / 3);
            const f = (d - ideal) * strength * temp;
            const fx = (dx / d) * f;
            const fy = (dy / d) * f;
            gx[a] += fx; gy[a] += fy;
            gx[b] -= fx; gy[b] -= fy;
          }
          for (let i = 0; i < active.length; i += 1) {
            const a = active[i];
            for (let j = i + 1; j < active.length; j += 1) {
              const b = active[j];
              const dx = gx[b] - gx[a];
              const dy = gy[b] - gy[a];
              let d = Math.hypot(dx, dy);
              if (d < 1) d = 1;
              const minD = gr[a] + gr[b] + 14;
              let f;
              if (d < minD) {
                f = (minD - d) * 0.42 * temp;
              } else {
                f = Math.min(5, 42000 / (d * d)) * temp * 0.5;
              }
              const fx = (dx / d) * f;
              const fy = (dy / d) * f;
              gx[a] -= fx; gy[a] -= fy;
              gx[b] += fx; gy[b] += fy;
            }
          }
          for (const g of active) {
            gx[g] *= 1 - 0.0015 * temp;
            gy[g] *= 1 - 0.0015 * temp;
          }
        }

        // -- per-tier character positions: phyllotaxis packing around the guild well.
        // Member ordering is a stable per-character hash so a raider keeps roughly the
        // same seat in their guild from tier to tier; only real changes move dots far.
        const ord = new Float64Array(CC);
        for (let c = 0; c < CC; c += 1) ord[c] = hash32("c" + c) / 4294967296;

        const tiers = [];
        for (let t = 0; t < TC; t += 1) {
          const arr = tierChars[t];
          const count = arr.length / 3;
          const members = new Map(); // g -> slot indices
          const td = {
            tierIndex: t,
            count,
            c: new Int32Array(count),
            g: new Int32Array(count),
            r: new Int32Array(count),
            classID: new Int16Array(count),
            x: new Float32Array(count),
            y: new Float32Array(count),
            slotOf: new Map(),
            members,
            roster: rosters[t],
            secondaries: tierSecondaries[t],
            grid: null,
          };
          for (let i = 0, s = 0; i < arr.length; i += 3, s += 1) {
            td.c[s] = arr[i];
            td.g[s] = arr[i + 1];
            td.r[s] = arr[i + 2];
            td.classID[s] = classIDForEntity(arr[i], t);
            td.slotOf.set(arr[i], s);
            let list = members.get(arr[i + 1]);
            if (!list) members.set(arr[i + 1], (list = []));
            list.push(s);
          }
          for (const [g, slots] of members) {
            slots.sort((a, b) => ord[td.c[a]] - ord[td.c[b]]);
            ensurePhyllo(slots.length);
            for (let k = 0; k < slots.length; k += 1) {
              const s = slots[k];
              td.x[s] = gx[g] + phX[k];
              td.y[s] = gy[g] + phY[k];
            }
          }
          tiers.push(td);
        }

        // -- migrations between consecutive tiers + churn stats
        const flows = new Array(TC).fill(null);
        const stats = new Array(TC).fill(null);
        for (let t = 0; t < TC; t += 1) {
          const td = tiers[t];
          const st = { present: td.count, guilds: td.roster.size, stayed: 0, switched: 0, newFaces: 0, returning: 0, departed: 0 };
          const prevMovement = prevMovementTier[t];
          if (!isMovementIgnoredTier(t) && prevMovement >= 0) {
            const prev = tiers[prevMovement];
            const flowMap = new Map(); // gPrev*100000+gCur -> { n, cs: sample char idxs }
            for (let s = 0; s < td.count; s += 1) {
              const c = td.c[s];
              const prevSlot = prev.slotOf.get(c);
              if (prevSlot !== undefined) {
                const a = prev.g[prevSlot];
                const b = td.g[s];
                if (a === b) st.stayed += 1; else st.switched += 1;
                const key = a * 100000 + b;
                let flow = flowMap.get(key);
                if (!flow) flowMap.set(key, (flow = { n: 0, cs: [] }));
                flow.n += 1;
                if (flow.cs.length < 30) flow.cs.push(c);
              } else if (firstMovementTierByChar[c] === t) {
                st.newFaces += 1;
              } else {
                st.returning += 1;
              }
            }
            for (let s = 0; s < prev.count; s += 1) {
              if (!td.slotOf.has(prev.c[s])) st.departed += 1;
            }
            flows[t] = flowMap;
          }
          stats[t] = st;
        }

        F.tiers = tiers;
        F.flows = flows;
        F.stats = stats;
        F.charTiers = charTiers;
        F.charMovementTiers = charMovementTiers;
        F.firstTier = firstTier;
        F.firstMovementTier = firstMovementTierByChar;
        F.movementTiers = movementTiers;
        F.prevMovementTier = prevMovementTier;
        F.nextMovementTier = nextMovementTier;
        F.gx = gx;
        F.gy = gy;
        F.guildMax = guildMax;
        F.active = active;
        F.ord = ord;
        F.allTime = null;

        buildAlluvial();

        // drop selections that the new filter erased
        if (view.selChar >= 0 && !(charTiers[view.selChar] || []).length) view.selChar = -1;
        if (view.selGuild >= 0 && guildMax[view.selGuild] === 0) view.selGuild = -1;
        view.trans = null;
        view.hover = null;
      }

      /* ============================== alluvial layout ============================== */

      function buildAlluvial() {
        const TC = M.tiers.length;
        const columns = [];
        const colFlows = new Array(TC).fill(null);

        const lumpOf = (t, g) => ((F.tiers[t].roster.get(g) || 0) >= ALLUVIAL_MIN_ROSTER ? g : LUMP);

        for (let t = 0; t < TC; t += 1) {
          const roster = F.tiers[t].roster;
          const nodes = [];
          let lumpCount = 0;
          for (const [g, n] of roster) {
            if (n >= ALLUVIAL_MIN_ROSTER) nodes.push({ g, count: n });
            else lumpCount += n;
          }
          nodes.sort((a, b) => F.gy[a.g] - F.gy[b.g] || F.gx[a.g] - F.gx[b.g]);
          if (lumpCount > 0) nodes.push({ g: LUMP, count: lumpCount });

          let y = 0;
          const byG = new Map();
          for (const node of nodes) {
            node.x = t * ALLUVIAL_COL_PITCH;
            node.y = y;
            node.h = Math.max(3, node.count * ALLUVIAL_K);
            y += node.h + 7;
            byG.set(node.g, node);
          }
          columns.push({ nodes, byG, height: y });
        }

        for (let t = 0; t < TC; t += 1) {
          const raw = F.flows[t];
          if (!raw) continue;
          const sourceTier = F.prevMovementTier[t];
          if (sourceTier < 0) continue;
          const agg = new Map();
          for (const [key, f] of raw) {
            const a = lumpOf(sourceTier, Math.floor(key / 100000));
            const b = lumpOf(t, key % 100000);
            const k2 = (a + 2) * 100000 + (b + 2);
            let cur = agg.get(k2);
            if (!cur) agg.set(k2, (cur = { n: 0, cs: [] }));
            cur.n += f.n;
            for (const c of f.cs) if (cur.cs.length < 12) cur.cs.push(c);
          }
          const list = [];
          for (const [k2, f] of agg) {
            const a = Math.floor(k2 / 100000) - 2;
            const b = (k2 % 100000) - 2;
            if (f.n < 2 && a !== b) continue;
            list.push({ a, b, n: f.n, cs: f.cs, sourceTier, targetTier: t });
          }

          const prevCol = columns[sourceTier];
          const col = columns[t];
          const yOf = (byG, g) => { const node = byG.get(g); return node ? node.y + node.h / 2 : 0; };

          // allocate slots within each node, sorted by partner position to minimise crossings
          const bySrc = new Map();
          const byDst = new Map();
          for (const flow of list) {
            if (!prevCol.byG.has(flow.a) || !col.byG.has(flow.b)) continue;
            (bySrc.get(flow.a) || bySrc.set(flow.a, []).get(flow.a)).push(flow);
            (byDst.get(flow.b) || byDst.set(flow.b, []).get(flow.b)).push(flow);
          }
          for (const [g, flowsOut] of bySrc) {
            flowsOut.sort((p, q) => yOf(col.byG, p.b) - yOf(col.byG, q.b));
            const node = prevCol.byG.get(g);
            const total = flowsOut.reduce((s, f) => s + f.n * ALLUVIAL_K, 0);
            const scale = total > node.h ? node.h / total : 1;
            let y = node.y;
            for (const f of flowsOut) {
              f.w = Math.max(0.8, f.n * ALLUVIAL_K * scale);
              f.ya = y;
              y += f.n * ALLUVIAL_K * scale;
            }
          }
          for (const [g, flowsIn] of byDst) {
            flowsIn.sort((p, q) => yOf(prevCol.byG, p.a) - yOf(prevCol.byG, q.a));
            const node = col.byG.get(g);
            const total = flowsIn.reduce((s, f) => s + f.n * ALLUVIAL_K, 0);
            const scale = total > node.h ? node.h / total : 1;
            let y = node.y;
            for (const f of flowsIn) {
              f.yb = y;
              y += f.n * ALLUVIAL_K * scale;
            }
          }
          colFlows[t] = list.filter((f) => f.ya !== undefined && f.yb !== undefined);
        }

        F.alluvial = { columns, flows: colFlows };
      }

      /* ============================== view transforms ============================== */

      function tf() {
        return view.tf[view.mode];
      }

      function toWorld(px, py) {
        const t = tf();
        return { x: (px - t.x) / t.k, y: (py - t.y) / t.k };
      }

      function fitBounds(t, x0, y0, x1, y1, insets = {}) {
        const rect = stage.getBoundingClientRect();
        const w = Math.max(1, x1 - x0);
        const h = Math.max(1, y1 - y0);
        const left = insets.left ?? 30;
        const right = insets.right ?? 30;
        const top = insets.top ?? 40;
        const bottom = insets.bottom ?? 100;
        const availableWidth = Math.max(160, rect.width - left - right);
        const availableHeight = Math.max(160, rect.height - top - bottom);
        const k = clamp(Math.min(availableWidth / w, availableHeight / h), 0.02, 2.5);
        t.k = k;
        t.x = left + availableWidth / 2 - (x0 + w / 2) * k;
        t.y = top + availableHeight / 2 - (y0 + h / 2) * k;
      }

      function fitGalaxy() {
        // Fit the roster-weighted core of the current tier; lone outlier guilds can
        // sit off-screen rather than shrinking the whole constellation to a blob.
        const td = F.tiers[view.tier];
        let weight = 0, mx = 0, my = 0;
        for (const [g, n] of td.roster) { weight += n; mx += F.gx[g] * n; my += F.gy[g] * n; }
        if (!weight) { fitBounds(view.tf.galaxy, -100, -100, 100, 100); view.fitted.galaxy = true; return; }
        mx /= weight; my /= weight;
        let vx = 0, vy = 0;
        for (const [g, n] of td.roster) {
          vx += n * (F.gx[g] - mx) ** 2;
          vy += n * (F.gy[g] - my) ** 2;
        }
        const rx = Math.max(260, Math.sqrt(vx / weight) * 2.3);
        const ry = Math.max(260, Math.sqrt(vy / weight) * 2.3);
        fitBounds(view.tf.galaxy, mx - rx, my - ry, mx + rx, my + ry);
        view.fitted.galaxy = true;
      }

      function fitMovement() {
        const derived = M.movementCurrent;
        const frame = derived?.frame;
        if (!frame?.guildActivity?.size) {
          fitBounds(view.tf.movement, -100, -100, 100, 100);
          view.fitted.movement = true;
          return;
        }
        let weight = 0;
        let mx = 0;
        let my = 0;
        for (const [g, n] of frame.guildActivity) {
          const point = movementGuildPoint(derived, g);
          weight += n;
          mx += point.x * n;
          my += point.y * n;
        }
        mx /= weight;
        my /= weight;
        let vx = 0;
        let vy = 0;
        for (const [g, n] of frame.guildActivity) {
          const point = movementGuildPoint(derived, g);
          vx += n * (point.x - mx) ** 2;
          vy += n * (point.y - my) ** 2;
        }
        const rx = Math.max(260, Math.sqrt(vx / weight) * 2.3);
        const ry = Math.max(260, Math.sqrt(vy / weight) * 2.3);
        fitBounds(
          view.tf.movement,
          mx - rx,
          my - ry,
          mx + rx,
          my + ry,
          { left: 260, right: 380, top: 120, bottom: 90 },
        );
        view.fitted.movement = true;
      }

      function fitFlow() {
        const cols = F.alluvial.columns;
        const maxH = Math.max(120, ...cols.map((c) => c.height));
        fitBounds(view.tf.flow, -40, -70, (cols.length - 1) * ALLUVIAL_COL_PITCH + ALLUVIAL_NODE_W + 160, Math.min(maxH, 2400));
        view.fitted.flow = true;
      }

      function panTo(wx, wy) {
        const rect = stage.getBoundingClientRect();
        const t = tf();
        t.x = rect.width / 2 - wx * t.k;
        t.y = (rect.height - 60) / 2 - wy * t.k;
      }

      function panMovementTo(wx, wy) {
        const rect = stage.getBoundingClientRect();
        const t = view.tf.movement;
        const left = 260;
        const right = 380;
        const top = 120;
        const bottom = 90;
        const availableWidth = Math.max(160, rect.width - left - right);
        const availableHeight = Math.max(160, rect.height - top - bottom);
        t.x = left + availableWidth / 2 - wx * t.k;
        t.y = top + availableHeight / 2 - wy * t.k;
      }

      /* ============================== all-time career graph ============================== */

      // Aggregates every tier: loyalists pack inside their one guild's cluster, while
      // multi-guild characters float at the weighted centre of every guild they raided
      // with, tethered to each by a fiber. The career social graph in one picture.
      function allTimeHullN(at, g) {
        return Math.max(1, at.hullN.get(g) || Math.ceil((at.roster.get(g) || 1) * 0.34));
      }

      function buildAllTimeGuildLayout(at, multis) {
        const active = Array.from(at.roster.keys()).sort((a, b) => at.roster.get(b) - at.roster.get(a) || a - b);
        const pairW = new Map();
        for (const [, totals] of multis) {
          const entries = Array.from(totals.entries());
          for (let a = 0; a < entries.length; a += 1) {
            for (let b = a + 1; b < entries.length; b += 1) {
              const ga = entries[a][0];
              const gb = entries[b][0];
              const lo = Math.min(ga, gb);
              const hi = Math.max(ga, gb);
              const key = lo * 100000 + hi;
              pairW.set(key, (pairW.get(key) || 0) + Math.sqrt(Math.min(entries[a][1], entries[b][1])));
            }
          }
        }

        for (const g of active) {
          at.gr[g] = hullRadius(allTimeHullN(at, g)) + 74;
        }
        active.forEach((g, i) => {
          const sourceD = Math.hypot(F.gx[g], F.gy[g]);
          if (sourceD > 1) {
            at.gx[g] = F.gx[g] * 2.2;
            at.gy[g] = F.gy[g] * 2.2;
          } else {
            const r = 170 * Math.sqrt(i + 0.5);
            at.gx[g] = Math.cos(i * PHYLLO_ANGLE) * r;
            at.gy[g] = Math.sin(i * PHYLLO_ANGLE) * r;
          }
        });

        const edges = [];
        for (const [key, w] of pairW) edges.push([Math.floor(key / 100000), key % 100000, w]);

        const ITERS = 520;
        for (let iter = 0; iter < ITERS; iter += 1) {
          const temp = 1 - (iter / ITERS) * 0.78;
          for (const [a, b, w] of edges) {
            const dx = at.gx[b] - at.gx[a];
            const dy = at.gy[b] - at.gy[a];
            const d = Math.max(1, Math.hypot(dx, dy));
            const ideal = at.gr[a] + at.gr[b] + 190;
            const strength = 0.0028 * Math.min(1, Math.log1p(w) / 4);
            const f = (d - ideal) * strength * temp;
            const fx = (dx / d) * f;
            const fy = (dy / d) * f;
            at.gx[a] += fx; at.gy[a] += fy;
            at.gx[b] -= fx; at.gy[b] -= fy;
          }
          for (let i = 0; i < active.length; i += 1) {
            const a = active[i];
            for (let j = i + 1; j < active.length; j += 1) {
              const b = active[j];
              const dx = at.gx[b] - at.gx[a];
              const dy = at.gy[b] - at.gy[a];
              let d = Math.hypot(dx, dy);
              if (d < 1) d = 1;
              const minD = at.gr[a] + at.gr[b] + 70;
              let f;
              if (d < minD) {
                f = (minD - d) * 0.48 * temp;
              } else {
                f = Math.min(8, 125000 / (d * d)) * temp * 0.42;
              }
              const fx = (dx / d) * f;
              const fy = (dy / d) * f;
              at.gx[a] -= fx; at.gy[a] -= fy;
              at.gx[b] += fx; at.gy[b] += fy;
            }
          }
          for (const g of active) {
            at.gx[g] *= 1 - 0.0007 * temp;
            at.gy[g] *= 1 - 0.0007 * temp;
          }
        }
      }

      function relaxAllTimeBridgeSlots(at, multiSlots) {
        const active = Array.from(at.roster.keys());
        for (let iter = 0; iter < 3; iter += 1) {
          for (const [s, memberGuilds] of multiSlots) {
            let x = at.x[s];
            let y = at.y[s];
            for (const g of active) {
              if (memberGuilds.has(g)) continue;
              let dx = x - at.gx[g];
              let dy = y - at.gy[g];
              let d = Math.hypot(dx, dy);
              if (d < 0.1) {
                const angle = (hash32(`${at.c[s]}:${g}`) % 6283) / 1000;
                dx = Math.cos(angle);
                dy = Math.sin(angle);
                d = 1;
              }
              const minD = hullRadius(allTimeHullN(at, g)) + 18;
              if (d < minD) {
                const push = (minD - d) * 0.72;
                x += (dx / d) * push;
                y += (dy / d) * push;
              }
            }
            at.x[s] = x;
            at.y[s] = y;
          }
        }
      }

      function buildAllTime() {
        if (F.allTime) return F.allTime;
        const mr = view.minReports;
        const singles = new Map(); // g -> [[c, reports]]
        const multis = [];
        let count = 0;
        for (let c = 0; c < M.chars.length; c += 1) {
          const mem = M.chars[c].mem;
          const totals = new Map();
          for (let i = 0; i < mem.length; i += 3) {
            const tier = mem[i];
            if (isMovementIgnoredTier(tier)) continue;
            if (mem[i + 2] >= mr) totals.set(mem[i + 1], (totals.get(mem[i + 1]) || 0) + mem[i + 2]);
          }
          if (!totals.size) continue;
          count += 1;
          if (totals.size === 1) {
            const [g, rep] = totals.entries().next().value;
            let list = singles.get(g);
            if (!list) singles.set(g, (list = []));
            list.push([c, rep]);
          } else {
            multis.push([c, totals]);
          }
        }

        const at = {
          count,
          c: new Int32Array(count),
          g: new Int32Array(count),
          rep: new Int32Array(count),
          guildN: new Int32Array(count),
          classID: new Int16Array(count),
          x: new Float32Array(count),
          y: new Float32Array(count),
          gx: new Float32Array(M.guilds.length),
          gy: new Float32Array(M.guilds.length),
          gr: new Float32Array(M.guilds.length),
          slotOf: new Map(),
          roster: new Map(), // g -> distinct members ever
