          hullN: new Map(), // g -> loyalist count (sizes the hull)
          fibers: [], // [slot, g, reports, slot, g, reports, ...] for multi-guild characters
          multiCount: multis.length,
          nomads: multis.map(([c, totals]) => [c, totals.size]).sort((p, q) => q[1] - p[1]).slice(0, 14),
          selMaskG: -2,
          selMask: null,
          grid: null,
        };

        for (const [g, list] of singles) {
          at.hullN.set(g, list.length);
          at.roster.set(g, (at.roster.get(g) || 0) + list.length);
        }
        for (const [, totals] of multis) {
          for (const [g] of totals) at.roster.set(g, (at.roster.get(g) || 0) + 1);
        }
        buildAllTimeGuildLayout(at, multis);

        let s = 0;
        for (const [g, list] of singles) {
          list.sort((p, q) => F.ord[p[0]] - F.ord[q[0]]);
          ensurePhyllo(list.length);
          for (let k = 0; k < list.length; k += 1) {
            at.c[s] = list[k][0];
            at.g[s] = g;
            at.rep[s] = list[k][1];
            at.guildN[s] = 1;
            at.classID[s] = classIDForEntity(list[k][0]);
            at.x[s] = at.gx[g] + phX[k];
            at.y[s] = at.gy[g] + phY[k];
            at.slotOf.set(list[k][0], s);
            s += 1;
          }
        }
        const multiSlots = [];
        for (const [c, totals] of multis) {
          let wsum = 0, x = 0, y = 0, best = -1, bestW = 0, repSum = 0;
          for (const [g, w] of totals) {
            const ww = Math.sqrt(w);
            wsum += ww;
            x += at.gx[g] * ww;
            y += at.gy[g] * ww;
            repSum += w;
            if (w > bestW) { bestW = w; best = g; }
          }
          const h = hash32("m" + c);
          const rad = 8 + ((h >>> 8) % 26);
          at.c[s] = c;
          at.g[s] = best;
          at.rep[s] = repSum;
          at.guildN[s] = totals.size;
          at.classID[s] = classIDForEntity(c);
          at.x[s] = x / wsum + Math.cos(h % 6283 / 1000) * rad;
          at.y[s] = y / wsum + Math.sin(h % 6283 / 1000) * rad;
          at.slotOf.set(c, s);
          for (const [g, w] of totals) at.fibers.push(s, g, w);
          multiSlots.push([s, new Set(totals.keys())]);
          s += 1;
        }
        relaxAllTimeBridgeSlots(at, multiSlots);

        F.allTime = at;
        return at;
      }

      function fitAll() {
        const at = buildAllTime();
        let weight = 0, mx = 0, my = 0;
        for (const [g, n] of at.roster) { weight += n; mx += at.gx[g] * n; my += at.gy[g] * n; }
        if (!weight) { fitBounds(view.tf.all, -100, -100, 100, 100); view.fitted.all = true; return; }
        mx /= weight; my /= weight;
        let vx = 0, vy = 0;
        for (const [g, n] of at.roster) {
          vx += n * (at.gx[g] - mx) ** 2;
          vy += n * (at.gy[g] - my) ** 2;
        }
        const rx = Math.max(340, Math.sqrt(vx / weight) * 2.55);
        const ry = Math.max(340, Math.sqrt(vy / weight) * 2.55);
        fitBounds(view.tf.all, mx - rx, my - ry, mx + rx, my + ry);
        view.fitted.all = true;
      }

      // characters whose guild changed since the previous counted tier, as ready-to-draw lines
      function tierTrails(t) {
        const td = F.tiers[t];
        if (td.trailsAll) return td.trailsAll;
        const out = [];
        const prevMovement = isMovementIgnoredTier(t) ? -1 : F.prevMovementTier[t];
        if (prevMovement >= 0) {
          const prev = F.tiers[prevMovement];
          for (let s = 0; s < td.count; s += 1) {
            const ps = prev.slotOf.get(td.c[s]);
            if (ps !== undefined && prev.g[ps] !== td.g[s]) {
              out.push([prev.x[ps], prev.y[ps], td.x[s], td.y[s], td.c[s], td.classID[s]]);
            }
          }
        }
        td.trailsAll = out;
        return out;
      }

      function drawTriangleArrow(x, y, dx, dy, size, fillStyle) {
        const len = Math.hypot(dx, dy);
        if (len < 0.1) return;
        const ux = dx / len;
        const uy = dy / len;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - ux * size - uy * size * 0.5, y - uy * size + ux * size * 0.5);
        ctx.lineTo(x - ux * size + uy * size * 0.5, y - uy * size - ux * size * 0.5);
        ctx.closePath();
        ctx.fillStyle = fillStyle;
        ctx.fill();
      }

      function quadraticPoint(x0, y0, cx, cy, x1, y1, u) {
        const inv = 1 - u;
        return {
          x: inv * inv * x0 + 2 * inv * u * cx + u * u * x1,
          y: inv * inv * y0 + 2 * inv * u * cy + u * u * y1,
        };
      }

      function quadraticTangent(x0, y0, cx, cy, x1, y1, u) {
        return {
          x: 2 * (1 - u) * (cx - x0) + 2 * u * (x1 - cx),
          y: 2 * (1 - u) * (cy - y0) + 2 * u * (y1 - cy),
        };
      }

      function drawQuadraticArrowheads(x0, y0, cx, cy, x1, y1, count, size, fillStyle) {
        const n = Math.max(1, count);
        for (let i = 0; i < n; i += 1) {
          const u = n === 1 ? 0.72 : 0.22 + (0.66 * i) / (n - 1);
          const p = quadraticPoint(x0, y0, cx, cy, x1, y1, u);
          const d = quadraticTangent(x0, y0, cx, cy, x1, y1, u);
          drawTriangleArrow(p.x, p.y, d.x, d.y, size, fillStyle);
        }
      }

      function drawLineArrowheads(x0, y0, x1, y1, count, size, fillStyle) {
        const dx = x1 - x0;
        const dy = y1 - y0;
        const len = Math.hypot(dx, dy);
        if (len < 18) return;
        const n = Math.max(1, count);
        for (let i = 0; i < n; i += 1) {
          const u = n === 1 ? 0.68 : 0.24 + (0.58 * i) / (n - 1);
          drawTriangleArrow(x0 + dx * u, y0 + dy * u, dx, dy, size, fillStyle);
        }
      }

      /* ============================== tier switching ============================== */

      function setTier(t, animate = true) {
        t = clamp(t, 0, M.tiers.length - 1);
        if (t === view.tier) return;
        if (view.mode === "movement") {
          stopPlay();
          view.tier = t;
          view.selMovement = -1;
          view.selGuild = -1;
          view.hover = null;
          M.movementCurrent = null;
          buildTimeline();
          updateHud();
          renderInspector();
          loadMovementForTier(t);
          return;
        }
        const from = F.tiers[view.tier];
        const to = F.tiers[t];
        view.tier = t;

        if (animate && !prefersReducedMotion && view.mode === "galaxy") {
          const prevX = new Float32Array(to.count).fill(NaN);
          const prevY = new Float32Array(to.count).fill(NaN);
          const trails = [];
          for (let s = 0; s < to.count; s += 1) {
            const slot = from.slotOf.get(to.c[s]);
            if (slot !== undefined) {
              prevX[s] = from.x[slot];
              prevY[s] = from.y[slot];
              if (from.g[slot] !== to.g[s] && trails.length < 4000) {
                trails.push([from.x[slot], from.y[slot], to.x[s], to.y[s], to.c[s], to.classID[s]]);
              }
            }
          }
          const leavers = [];
          for (let s = 0; s < from.count && leavers.length < 6000; s += 1) {
            if (!to.slotOf.has(from.c[s])) leavers.push([from.x[s], from.y[s], from.c[s], from.classID[s]]);
          }
          view.trans = { start: performance.now(), prevX, prevY, trails, leavers };
        } else {
          view.trans = null;
        }

        updateHud();
        renderInspector();
      }

      function moveToAdjacentMovementTier(direction) {
        const next = adjacentMovementTier(view.tier, direction);
        if (next === null) return false;
        setTier(next);
        return true;
      }

      function startPlay() {
        if (view.playing) return;
        if (view.mode === "movement") {
          const derived = M.movementCurrent;
          if (!derived?.buckets?.length) return;
          view.playing = true;
          els.playBtn.textContent = "❚❚";
          els.playBtn.title = networkCopy.pauseMovement;
          if (view.movementStep >= derived.buckets.length - 1) setMovementStep(0);
          view.playTimer = setInterval(() => {
            if (view.movementStep >= derived.buckets.length - 1) {
              stopPlay();
            } else {
              setMovementStep(view.movementStep + 1);
            }
          }, prefersReducedMotion ? MOVEMENT_PLAY_MS * 1.5 : MOVEMENT_PLAY_MS);
          return;
        }
        view.playing = true;
        els.playBtn.textContent = "❚❚";
        els.playBtn.title = networkCopy.pauseTiers;
        if (view.tier >= lastMovementTier() || adjacentMovementTier(view.tier, 1) === null) setTier(firstMovementTier());
        view.playTimer = setInterval(() => {
          if (!moveToAdjacentMovementTier(1)) stopPlay();
        }, PLAY_MS);
      }

      function stopPlay() {
        view.playing = false;
        els.playBtn.textContent = "▶";
        els.playBtn.title = view.mode === "movement" ? networkCopy.playMovement : networkCopy.playTiers;
        if (view.playTimer) clearInterval(view.playTimer);
        view.playTimer = null;
      }

      /* ============================== HUD (title, stats, timeline) ============================== */

      function updateHud() {
        const tier = M.tiers[view.tier];
        if (view.mode === "galaxy") {
          els.titleMain.textContent = tier.name;
          els.titleSub.textContent = `${tier.expansion} · ${monthYear(tier.start)} · tier ${view.tier + 1} of ${M.tiers.length}`;
        } else if (view.mode === "movement") {
          els.titleMain.textContent = `${tier.name} · ${networkCopy.movement}`;
          const derived = M.movementCurrent;
          if (derived?.error) {
            els.titleSub.textContent = derived.error;
          } else {
            const range = derived?.model?.raid?.start
              ? `${movementDate(derived.model.raid.start, true)} → ${movementDate(derived.model.raid.end || derived.model.raid.start, true)} · `
              : "";
            els.titleSub.textContent = `${range}${isAccountMode() ? networkCopy.accountMovementDescription : networkCopy.movementDescription}`;
          }
        } else if (view.mode === "all") {
          const first = M.tiers[firstMovementTier()] || M.tiers[0];
          const last = M.tiers[lastMovementTier()] || M.tiers[M.tiers.length - 1];
          els.titleMain.textContent = "All raids combined";
          els.titleSub.textContent = `${monthYear(first.start)} → ${monthYear(last.start)} · multi-guild ${entityPlural()} float between every guild of their career`;
        } else {
          els.titleMain.textContent = "Guild lineages";
          els.titleSub.textContent = `Each band is a guild's roster flowing through time. Ribbons are ${entityPlural()} who stayed or moved.`;
        }
        canvas.setAttribute("aria-label", `${els.titleMain.textContent}. ${els.titleSub.textContent}`);
        renderStats();
        renderTimeline();
      }

      function renderStats() {
        let items;
        if (view.mode === "galaxy") {
          const st = F.stats[view.tier];
          items = [
            [entityPluralTitle(), st.present],
            ["Guilds", st.guilds],
            ["Stayed", st.stayed],
            ["Switched", st.switched],
            ["Returned", st.returning],
            ["New", st.newFaces],
            ["Gone", st.departed],
          ];
          if (isMovementIgnoredTier(view.tier) || F.prevMovementTier[view.tier] < 0) items = items.slice(0, 2);
        } else if (view.mode === "movement") {
          const metrics = M.movementCurrent?.frame?.metrics || { entities: 0, guilds: 0, multiGuild: 0, changes: 0, observations: 0 };
          items = [
            [networkCopy.entitiesObserved, metrics.entities],
            [networkCopy.guildsObserved, metrics.guilds],
            [networkCopy.multiGuildEntities, metrics.multiGuild],
            [networkCopy.observedChanges, metrics.changes],
            [networkCopy.reportObservations, metrics.observations],
          ];
        } else if (view.mode === "all") {
          const at = buildAllTime();
          items = [
            [entityPluralTitle(), at.count],
            ["Guilds", at.roster.size],
            ["Loyalists", at.count - at.multiCount],
            ["Multi-guild", at.multiCount],
          ];
        } else {
          let migrations = 0;
          for (const flowMap of F.flows) {
            if (!flowMap) continue;
            for (const [key, flow] of flowMap) {
              if (Math.floor(key / 100000) !== key % 100000) migrations += flow.n;
            }
          }
          items = [
            ["Tiers", M.tiers.length],
            ["Guilds", F.active.length],
            [entityPluralTitle(), M.chars.reduce((s, ch, c) => s + ((F.charTiers[c] || []).length ? 1 : 0), 0)],
            ["Guild switches", migrations],
          ];
        }
        els.stats.innerHTML = items
          .map(([label, value]) => `<div class="stat"><strong>${fmt(value)}</strong><span>${label}</span></div>`)
          .join("");
      }

      function buildTimeline() {
        if (view.mode === "movement") {
          const derived = M.movementCurrent;
          const max = Math.max(0, (derived?.buckets?.length || 1) - 1);
          els.tierCells.innerHTML = `
            <div class="movement-scrubber">
              <select id="movementRaid" aria-label="${esc(networkCopy.raidSelectorLabel)}">
                ${M.tiers.map((tier, t) => `<option value="${t}" ${t === view.tier ? "selected" : ""}>${esc(tier.name)}</option>`).join("")}
              </select>
              <input id="movementRange" type="range" min="0" max="${max}" value="${clamp(view.movementStep, 0, max)}"
                ${derived?.buckets?.length ? "" : "disabled"} aria-label="${esc(networkCopy.timelineLabel)}" />
              <output id="movementDate" aria-live="polite"></output>
            </div>`;
          const raidSelect = document.getElementById("movementRaid");
          raidSelect.addEventListener("change", () => setTier(Number(raidSelect.value)), { signal: listenerSignal });
          const range = document.getElementById("movementRange");
          range.addEventListener("input", () => {
            stopPlay();
            setMovementStep(Number(range.value));
          }, { signal: listenerSignal });
          els.playBtn.disabled = !derived?.buckets?.length;
          els.playBtn.title = view.playing ? networkCopy.pauseMovement : networkCopy.playMovement;
          renderTimeline();
          return;
        }
        els.playBtn.disabled = false;
        els.playBtn.title = view.playing ? networkCopy.pauseTiers : networkCopy.playTiers;
        els.tierCells.innerHTML = M.tiers
          .map((tier, t) => `
            <button class="tier-cell" type="button" data-t="${t}" title="${esc(tier.name)} · ${esc(tier.expansion)} · ${monthYear(tier.start)}${isMovementIgnoredTier(t) ? " · movement skipped" : ""}">
              <span class="bar" style="background:${expColor(tier.expansion)}"></span>
              <span class="abbr">${esc(tierAbbr(tier.name))}</span>
              <span class="yr">${tier.start ? new Date(tier.start).getFullYear() : ""}</span>
            </button>`)
          .join("");
        for (const cell of els.tierCells.querySelectorAll("[data-t]")) {
          cell.addEventListener("click", () => {
            stopPlay();
            if (view.mode === "all") setMode("galaxy");
            setTier(Number(cell.dataset.t));
          }, { signal: listenerSignal });
        }
        renderTimeline();
      }

      function renderTimeline() {
        if (view.mode === "movement") {
          const derived = M.movementCurrent;
          const range = document.getElementById("movementRange");
          const output = document.getElementById("movementDate");
          if (!range || !output || !derived?.buckets?.length) {
            if (output) output.textContent = networkCopy.movementEmptyTitle;
            return;
          }
          range.value = String(view.movementStep);
          if (view.movementStep >= derived.buckets.length - 1) {
            const first = derived.buckets[0];
            const last = derived.buckets[derived.buckets.length - 1];
            output.textContent = `${networkCopy.wholeTier} · ${movementDate(first)}–${movementDate(last, true)}`;
          } else {
            output.textContent = movementDate(derived.buckets[view.movementStep], true);
          }
          return;
        }
        for (const cell of els.tierCells.querySelectorAll("[data-t]")) {
          cell.classList.toggle("active", view.mode !== "all" && Number(cell.dataset.t) === view.tier);
        }
      }

      /* ============================== inspector panels ============================== */

      function setInspectorOpen() {
        view.inspectorOpen = true;
        els.inspectorPanel.classList.remove("collapsed");
      }

      function renderInspector() {
        if (view.mode === "movement") return renderMovementInspector();
        if (view.selChar >= 0) return renderCharPanel(view.selChar);
        if (view.selGuild >= 0) return renderGuildPanel(view.selGuild);
        if (view.mode === "all") return renderAllPanel();
        renderTierPanel();
      }

      function movementAltHtml(derived, altIndexes) {
        const unique = Array.from(new Set(altIndexes || []));
        return unique
          .map((index) => {
            const character = derived.model.characters[index];
            if (!character) return "";
            const color = CLASS_COLORS[character.classID] || CLASS_COLORS[0];
            return `<span class="char-ref static">
              ${classIconHtml(character.classID)}
              <span class="char-ref-name" style="color:${color}"><span class="name">${esc(character.name)}</span>${realmInline(character.realm)}</span>
            </span>`;
          })
          .join("");
      }

      function movementRouteSummaries(flows) {
        const routes = new Map();
        for (const flow of flows) {
          const a = Math.min(flow.a, flow.b);
          const b = Math.max(flow.a, flow.b);
          const key = `${a}:${b}`;
          let route = routes.get(key);
          if (!route) {
            route = { a, b, total: 0, ab: 0, ba: 0, contributors: new Map() };
            routes.set(key, route);
          }
          route.total += flow.n;
          if (flow.a === a && flow.b === b) route.ab += flow.n;
          else route.ba += flow.n;

          for (const [entityIndex, contribution] of flow.contributors) {
            let contributor = route.contributors.get(entityIndex);
            if (!contributor) {
              contributor = { count: 0, altCounts: new Map() };
              route.contributors.set(entityIndex, contributor);
            }
            contributor.count += contribution.count;
            for (const [altIndex, count] of contribution.altCounts) {
              contributor.altCounts.set(altIndex, (contributor.altCounts.get(altIndex) || 0) + count);
            }
          }
        }
        return Array.from(routes.values()).sort((a, b) => b.total - a.total || a.a - b.a || a.b - b.b);
      }

      function movementEntityCountLabel(count) {
        const label = isAccountMode()
          ? count === 1 ? networkCopy.account : networkCopy.accountCountUnit
          : count === 1 ? networkCopy.singleCharacter : networkCopy.characterCountUnit;
        return `${fmt(count)} ${String(label).toLocaleLowerCase(networkLocale)}`;
      }

      function movementContributorClassID(derived, entityIndex, contributor) {
        let representativeAlt = null;
        let representativeCount = -1;
        for (const [altIndex, count] of contributor.altCounts) {
          if (count > representativeCount || (count === representativeCount && (representativeAlt === null || altIndex < representativeAlt))) {
            representativeAlt = altIndex;
            representativeCount = count;
          }
        }
        const entity = derived.entities[entityIndex];
        const altIndex = representativeAlt ?? entity.memberIndexes[0];
        return derived.model.characters[altIndex]?.classID || entity.classID || 0;
      }

      function renderMovementSummary(derived) {
        const frame = derived.frame;
        els.insTitle.textContent = networkCopy.movementSummary;
        els.insSub.textContent = networkCopy.clickMovementEntity;
        const routes = movementRouteSummaries(frame.flows);
        els.insBody.innerHTML = `
          <section class="panel">
            <div class="card movement-note">${esc(isAccountMode() ? networkCopy.accountMovementDescription : networkCopy.movementDescription)}</div>
          </section>
          <section class="panel">
            <h3>${esc(networkCopy.biggestFlows)}</h3>
            <div class="list">
              ${routes.length ? routes.slice(0, 10).map((route) => {
                const contributors = Array.from(route.contributors.entries()).sort((a, b) => {
                  const countDifference = b[1].count - a[1].count;
                  if (countDifference) return countDifference;
                  return derived.entities[a[0]].name.localeCompare(derived.entities[b[0]].name) || a[0] - b[0];
                });
                const shown = contributors.slice(0, 4);
                const extra = contributors.length - shown.length;
                const changesLabel = route.total === 1 ? networkCopy.singleChange : networkCopy.changeCountUnit;
                const direction = route.ab > 0 && route.ba > 0 ? "⇄" : route.ab > 0 ? "→" : "←";
                const directionCounts = [
                  route.ab > 0 ? `<span>${fmt(route.ab)} →</span>` : "",
                  route.ba > 0 ? `<span>${fmt(route.ba)} ←</span>` : "",
                ].filter(Boolean).join(`<span class="movement-route-separator">·</span>`);
                return `<div class="card">
                  <div class="row-main">
                    <span><button class="glink" type="button" data-sel-guild="${route.a}">${guildIdentityHtml(route.a, { realmIfDuplicate: true })}</button> ${direction} <button class="glink" type="button" data-sel-guild="${route.b}">${guildIdentityHtml(route.b, { realmIfDuplicate: true })}</button></span>
                    <span class="movement-route-total">
                      <span>${fmt(route.total)}</span>
                      <span class="movement-route-unit">${esc(changesLabel)}</span>
                    </span>
                  </div>
                  <div class="row-sub movement-route-meta">
                    ${directionCounts}
                    <span class="movement-route-separator">·</span>
                    <span>${esc(movementEntityCountLabel(contributors.length))}</span>
                  </div>
                  <div class="char-refs movement-route-movers">
                    ${shown.map(([entityIndex, contributor]) => {
                      const entity = derived.entities[entityIndex];
                      const classID = movementContributorClassID(derived, entityIndex, contributor);
                      const count = contributor.count > 1 ? `<span class="movement-contribution">×${fmt(contributor.count)}</span>` : "";
                      return `<button class="chip" type="button" data-sel-movement="${entityIndex}" style="color:${CLASS_COLORS[classID] || CLASS_COLORS[0]}">${esc(entity.name)}${count}</button>`;
                    }).join("")}
                    ${extra > 0 ? `<span class="char-more">+${fmt(extra)} ${esc(networkCopy.moreMovers)}</span>` : ""}
                  </div>
                </div>`;
              }).join("") : `<div class="card"><div class="row-sub">${esc(networkCopy.noObservedChanges)}</div></div>`}
            </div>
          </section>`;
        bindInspectorActions();
      }

      function renderMovementEntityPanel(derived, entityIndex) {
        const timeline = derived.timelines[entityIndex];
        const entity = derived.entities[entityIndex];
        if (!timeline || !entity) {
          view.selMovement = -1;
          return renderMovementSummary(derived);
        }
        const cutoff = derived.frame.cutoff;
        const sequence = timeline.visibleSequence.filter((item) => item.start <= cutoff);
        const guildsSeen = new Set();
        for (const item of sequence) {
          if (item.kind === "stint") guildsSeen.add(item.g);
          else for (const guild of item.guilds) guildsSeen.add(guild.g);
        }
        const transitionsByTarget = new Map(
          timeline.visibleTransitions.filter((transition) => transition.time <= cutoff).map((transition) => [transition.to, transition]),
        );
        const memberCount = entity.memberIndexes.length;
        els.insTitle.textContent = entity.name;
        els.insSub.textContent = entity.isAccount
          ? `${networkCopy.inferredAccount} · ${fmt(memberCount)} ${networkCopy.linkedCharacters} · ${fmt(guildsSeen.size)} ${networkCopy.guildsObserved.toLowerCase()}`
          : `${realmLabel(entity.realm)} · ${CLASS_NAMES[entity.classID] || "Unknown"} · ${fmt(guildsSeen.size)} ${networkCopy.guildsObserved.toLowerCase()}`;

        els.insBody.innerHTML = `
          <section class="panel">
            <h3>${esc(networkCopy.stints)}</h3>
            <div class="list">
              ${sequence.length ? sequence.map((item) => {
                if (item.kind === "ambiguous") {
                  return `<div class="card ambiguous-card">
                    <div class="row-main"><span>${esc(networkCopy.ambiguousTitle)}</span><span>${movementDate(item.start, true)}</span></div>
                    <div class="row-sub">${esc(networkCopy.ambiguousBody)}</div>
                    <div class="list" style="margin-top:8px">
                      ${item.guilds.map((guild) => {
                        const observations = guild.observations.filter((observation) => observation.time <= cutoff);
                        const altIndexes = Array.from(new Set(observations.flatMap((observation) => observation.altIndexes || [])));
                        return `
                          <button class="card" type="button" data-sel-guild="${guild.g}">
                            <div class="row-main">${guildIdentityHtml(guild.g, { realmIfDuplicate: true })}<span>${esc(reportCountLabel(observations.length))}</span></div>
                            ${entity.isAccount ? `<div class="char-refs">${movementAltHtml(derived, altIndexes)}</div>` : ""}
                          </button>`;
                      }).join("")}
                    </div>
                  </div>`;
                }
                const transition = transitionsByTarget.get(item);
                const visibleObservations = item.observations.filter((observation) => observation.time <= cutoff);
                const reportCount = visibleObservations.length;
                const visibleEnd = visibleObservations[visibleObservations.length - 1]?.end ?? item.start;
                const altIndexes = transition?.altIndexes || visibleObservations[0]?.altIndexes || Array.from(item.altIndexes);
                const changeText = transition ? networkCopy.changedTo : networkCopy.firstSeenWith;
                return `
                  <div class="movement-change">${esc(changeText)} · ${movementDate(item.start, true)}${entity.isAccount ? ` · ${esc(networkCopy.responsibleAlt)}` : ""}</div>
                  ${entity.isAccount ? `<div class="char-refs">${movementAltHtml(derived, altIndexes)}</div>` : ""}
                  <button class="card" type="button" data-sel-guild="${item.g}">
                    <div class="row-main">${guildIdentityHtml(item.g, { realmIfDuplicate: true })}<span>${esc(reportCountLabel(reportCount))}</span></div>
                    <div class="row-sub">${movementDate(item.start, true)} → ${movementDate(visibleEnd, true)}</div>
                  </button>`;
              }).join("") : `<div class="card"><div class="row-sub">${esc(networkCopy.noStintsUnderFilter)}</div></div>`}
            </div>
          </section>
          ${entity.isAccount ? `<section class="panel">
            <h3>${esc(networkCopy.linkedCharacters)}</h3>
            <div class="char-refs">${movementAltHtml(derived, entity.memberIndexes)}</div>
          </section>` : ""}`;
        bindInspectorActions();
      }

      function renderMovementGuildPanel(derived, g) {
        const frame = derived.frame;
        const guild = M.guilds[g];
        const related = [];
        derived.timelines.forEach((timeline, entityIndex) => {
          const reports = timeline.visibleSequence.reduce((sum, item) => {
            if (item.start > frame.cutoff) return sum;
            if (item.kind === "stint") return sum + (item.g === g ? item.observations.filter((observation) => observation.time <= frame.cutoff).length : 0);
            const ambiguousGuild = item.guilds.find((entry) => entry.g === g);
            return sum + (ambiguousGuild ? ambiguousGuild.observations.filter((observation) => observation.time <= frame.cutoff).length : 0);
          }, 0);
          if (reports) related.push([entityIndex, reports]);
        });
        related.sort((a, b) => b[1] - a[1]);
        const relatedReportCount = related.reduce((sum, entry) => sum + entry[1], 0);
        const incoming = frame.flows.filter((flow) => flow.b === g).sort((a, b) => b.n - a.n);
        const outgoing = frame.flows.filter((flow) => flow.a === g).sort((a, b) => b.n - a.n);
        els.insTitle.textContent = guild.name;
        els.insSub.textContent = `${realmLabel(guild.realm)} · ${fmt(frame.guildActivity.get(g) || 0)} ${networkCopy.entitiesObserved.toLowerCase()} · ${fmt(relatedReportCount)} ${networkCopy.reportObservations.toLowerCase()}`;
        const flowRows = (rows, direction) => rows.slice(0, 8).map((flow) => {
          const other = direction === "in" ? flow.a : flow.b;
          return `<button class="card" type="button" data-sel-guild="${other}">
            <div class="row-main">${guildIdentityHtml(other, { realmIfDuplicate: true })}<span>${fmt(flow.n)}</span></div>
          </button>`;
        }).join("");
        els.insBody.innerHTML = `
          <section class="panel">
            <h3>${esc(networkCopy.entitiesObserved)}</h3>
            <div class="list">
              ${related.slice(0, 16).map(([entityIndex, reports]) => {
                const entity = derived.entities[entityIndex];
                return `<button class="card" type="button" data-sel-movement="${entityIndex}">
                  <div class="row-main"><span>${esc(entity.name)}</span><span>${esc(reportCountLabel(reports))}</span></div>
                </button>`;
              }).join("")}
            </div>
          </section>
          <section class="panel">
            <h3>${esc(networkCopy.observedFrom)}</h3>
            <div class="list">${flowRows(incoming, "in") || `<div class="card"><div class="row-sub">${esc(networkCopy.noObservedChanges)}</div></div>`}</div>
          </section>
          <section class="panel">
            <h3>${esc(networkCopy.observedTo)}</h3>
            <div class="list">${flowRows(outgoing, "out") || `<div class="card"><div class="row-sub">${esc(networkCopy.noObservedChanges)}</div></div>`}</div>
          </section>`;
        bindInspectorActions();
      }

      function renderMovementInspector() {
        const derived = M.movementCurrent;
        if (!derived || derived.error || !derived.frame || !derived.buckets?.length) {
          els.insTitle.textContent = derived?.error ? networkCopy.errorTitle : networkCopy.movementEmptyTitle;
          els.insSub.textContent = derived?.error || networkCopy.movementEmptyBody;
          els.insBody.innerHTML = `<div class="card movement-note">${esc(derived?.error || networkCopy.movementEmptyBody)}</div>`;
          return;
        }
        if (view.selMovement >= 0) return renderMovementEntityPanel(derived, view.selMovement);
        if (view.selGuild >= 0) return renderMovementGuildPanel(derived, view.selGuild);
        renderMovementSummary(derived);
      }

      function nameChips(flow, max = 8) {
        const shown = flow.cs.slice(0, max);
        const extra = flow.n - shown.length;
        return shown
          .map((c) => characterRefHtml(c))
          .join("") + (extra > 0 ? `<span class="char-more">+${fmt(extra)} more</span>` : "");
      }

      function bindInspectorActions() {
        for (const el of els.insBody.querySelectorAll("[data-sel-guild]")) {
          el.addEventListener("click", () => selectGuild(Number(el.dataset.selGuild)), { signal: listenerSignal });
        }
        for (const el of els.insBody.querySelectorAll("[data-sel-char]")) {
          el.addEventListener("click", () => selectChar(Number(el.dataset.selChar)), { signal: listenerSignal });
        }
        for (const el of els.insBody.querySelectorAll("[data-sel-movement]")) {
          el.addEventListener("click", () => selectMovementEntity(Number(el.dataset.selMovement)), { signal: listenerSignal });
        }
        for (const el of els.insBody.querySelectorAll("[data-go-tier]")) {
          el.addEventListener("click", () => { stopPlay(); setTier(Number(el.dataset.goTier)); }, { signal: listenerSignal });
        }
      }

      function renderTierPanel() {
        const t = view.tier;
        const tier = M.tiers[t];
        const td = F.tiers[t];
        els.insTitle.textContent = "Raid summary";
        els.insSub.textContent = `${tier.expansion} · ${monthYear(tier.start)} · ${fmt(td.count)} ${entityPlural()} in ${fmt(td.roster.size)} guilds`;

        const top = Array.from(td.roster.entries()).sort((a, b) => b[1] - a[1]).slice(0, 8);
        const moves = [];
        if (F.flows[t]) {
          for (const [key, flow] of F.flows[t]) {
            const a = Math.floor(key / 100000);
            const b = key % 100000;
            if (a !== b && flow.n >= 2) moves.push([a, b, flow]);
          }
          moves.sort((p, q) => q[2].n - p[2].n);
        }
        const movementEmptyText = isMovementIgnoredTier(t)
          ? "Movement calculations skip this raid tier."
          : F.prevMovementTier[t] < 0
            ? "First counted tier - no previous tier."
            : `No multi-${entitySingular()} moves under this filter.`;

        els.insBody.innerHTML = `
          <section class="panel">
            <h3>Biggest rosters</h3>
            <div class="list">
              ${top.map(([g, n]) => `
                <button class="card" type="button" data-sel-guild="${g}">
                  <div class="row-main">${guildIdentityHtml(g, { realmIfDuplicate: true })}<span>${fmt(n)}</span></div>
                </button>`).join("")}
            </div>
          </section>
          <section class="panel">
            <h3>Biggest moves vs previous counted tier</h3>
            <div class="list">
              ${moves.length === 0 ? `<div class="card"><div class="row-sub">${movementEmptyText}</div></div>` : ""}
              ${moves.slice(0, 10).map(([a, b, flow]) => `
                <div class="card">
                  <div class="row-main">
                    <span><span class="glink" data-sel-guild="${a}">${guildIdentityHtml(a, { realmIfDuplicate: true })}</span> → <span class="glink" data-sel-guild="${b}">${guildIdentityHtml(b, { realmIfDuplicate: true })}</span></span>
                    <span>${fmt(flow.n)}</span>
                  </div>
                  <div class="char-refs">${nameChips(flow)}</div>
                </div>`).join("")}
            </div>
          </section>`;
        bindInspectorActions();
      }

      function renderAllPanel() {
        const at = buildAllTime();
        const first = M.tiers[firstMovementTier()] || M.tiers[0];
        const last = M.tiers[lastMovementTier()] || M.tiers[M.tiers.length - 1];
        els.insTitle.textContent = "All raids combined";
        els.insSub.textContent = `${monthYear(first.start)} → ${monthYear(last.start)} · ${fmt(at.count)} ${entityPlural()}, ${fmt(at.multiCount)} of them in 2+ guilds`;

        const top = Array.from(at.roster.entries()).sort((a, b) => b[1] - a[1]).slice(0, 8);
        els.insBody.innerHTML = `
          <section class="panel">
            <h3>Most distinct members ever</h3>
            <div class="list">
              ${top.map(([g, n]) => `
                <button class="card" type="button" data-sel-guild="${g}">
                  <div class="row-main">${guildIdentityHtml(g, { realmIfDuplicate: true })}<span>${fmt(n)}</span></div>
                </button>`).join("")}
            </div>
          </section>
          <section class="panel">
            <h3>Serial movers (most guilds in a career)</h3>
            <div class="list">
              ${at.nomads.map(([c, n]) => `
                <button class="card" type="button" data-sel-char="${c}">
                  <div class="row-main">
                    ${characterRefHtml(c, { realmIfDuplicate: true })}
                    <span>${fmt(n)} guilds</span>
                  </div>
                  <div class="row-sub"><span class="realm-muted">${esc(realmLabel(entityRealm(c)))}</span> · ${esc(CLASS_NAMES[classIDForEntity(c)] || "Unknown")} · ${fmt(M.chars[c].total)} report appearances</div>
                </button>`).join("")}
            </div>
          </section>`;
        bindInspectorActions();
      }

      function buildGuildCareerFlows(g) {
        const joined = new Map();
        const left = new Map();
        const add = (map, otherGuild, flow) => {
          let cur = map.get(otherGuild);
          if (!cur) map.set(otherGuild, (cur = { n: 0, cs: [], seen: new Set() }));
          cur.n += flow.n;
          for (const c of flow.cs) {
            if (cur.cs.length >= 40) break;
            if (cur.seen.has(c)) continue;
            cur.seen.add(c);
            cur.cs.push(c);
          }
        };

        for (let t = 1; t < M.tiers.length; t += 1) {
          const flowMap = F.flows[t];
          if (!flowMap) continue;
          for (const [key, flow] of flowMap) {
            const a = Math.floor(key / 100000);
            const b = key % 100000;
            if (a === b) continue;
            if (b === g) add(joined, a, flow);
            if (a === g) add(left, b, flow);
          }
        }

        return {
          joined: Array.from(joined.entries()).sort((p, q) => q[1].n - p[1].n),
          left: Array.from(left.entries()).sort((p, q) => q[1].n - p[1].n),
        };
      }

      function renderGuildPanel(g) {
        const guild = M.guilds[g];
        const t = view.tier;
        const allMode = view.mode === "all";
        const rosterNow = F.tiers[t].roster.get(g) || 0;

        const history = M.tiers.map((tier, i) => ({ i, n: F.tiers[i].roster.get(g) || 0 }));
        const peak = Math.max(1, ...history.map((h) => h.n));
        const activeTiers = history.filter((h) => h.n > 0);

        // tenure of current/overall members in this guild
        const tenure = new Map();
        for (let i = 0; i < M.tiers.length; i += 1) {
          if (isMovementIgnoredTier(i)) continue;
          const slots = F.tiers[i].members.get(g);
          if (!slots) continue;
          for (const s of slots) {
            const c = F.tiers[i].c[s];
            tenure.set(c, (tenure.get(c) || 0) + 1);
          }
        }
        const mainstays = Array.from(tenure.entries()).sort((a, b) => b[1] - a[1]).slice(0, 10);

        const inflow = [];
        const outflow = [];
        if (!isMovementIgnoredTier(t) && F.flows[t]) {
          for (const [key, flow] of F.flows[t]) {
            const a = Math.floor(key / 100000);
            const b = key % 100000;
            if (b === g && a !== g) inflow.push([a, flow]);
          }
        }
        const nextMovement = isMovementIgnoredTier(t) ? -1 : F.nextMovementTier[t];
        if (nextMovement >= 0 && F.flows[nextMovement]) {
          for (const [key, flow] of F.flows[nextMovement]) {
            const a = Math.floor(key / 100000);
            const b = key % 100000;
            if (a === g && b !== g) outflow.push([b, flow]);
          }
        }
        inflow.sort((p, q) => q[1].n - p[1].n);
        outflow.sort((p, q) => q[1].n - p[1].n);

        const careerFlows = allMode ? buildGuildCareerFlows(g) : null;
        const joinedRows = allMode ? careerFlows.joined : inflow;
        const leftRows = allMode ? careerFlows.left : outflow;
        const at = allMode ? buildAllTime() : null;
        const tierMovementSkipped = !allMode && isMovementIgnoredTier(t);
        const joinedEmptyText = tierMovementSkipped ? "Movement calculations skip this raid tier." : allMode ? "No tracked arrivals from another guild." : "No tracked arrivals from the previous counted tier.";
        const leftEmptyText = tierMovementSkipped ? "Movement calculations skip this raid tier." : allMode ? "No tracked departures to another guild." : "No tracked departures to the next counted tier.";

        els.insTitle.textContent = guild.name;
        els.insSub.textContent = allMode
          ? `${realmLabel(guild.realm)} · ${fmt(activeTiers.length)} tiers active · peak roster ${fmt(peak)} · ${fmt(at.roster.get(g) || 0)} distinct ${entityPlural()} ever`
          : `${realmLabel(guild.realm)} · ${fmt(activeTiers.length)} tiers active · peak roster ${fmt(peak)} · ${fmt(rosterNow)} this tier`;

        els.insBody.innerHTML = `
          <section class="panel">
            <h3>Roster across tiers — click to jump</h3>
            <div class="card">
              <div class="roster-bars">
                ${history.map((h) => `
                  <button type="button" data-go-tier="${h.i}" title="${esc(M.tiers[h.i].name)}: ${fmt(h.n)} ${entityPlural()}"
                    class="${!allMode && h.i === t ? "on" : ""}"
                    style="height:${Math.max(2, (h.n / peak) * 44)}px;background:hsl(${guild.hue} 65% 58%)"></button>`).join("")}
              </div>
            </div>
          </section>
          <section class="panel">
            <h3>${allMode ? "Joined across all tiers from" : "Joined this tier from"}</h3>
            <div class="list">
              ${joinedRows.length === 0 ? `<div class="card"><div class="row-sub">${joinedEmptyText}</div></div>` : ""}
              ${joinedRows.slice(0, allMode ? 8 : 6).map(([a, flow]) => `
                <div class="card">
                  <div class="row-main"><span class="glink" data-sel-guild="${a}">${guildIdentityHtml(a, { realmIfDuplicate: true })}</span><span>+${fmt(flow.n)}</span></div>
                  <div class="char-refs">${nameChips(flow, allMode ? 8 : 6)}</div>
                </div>`).join("")}
            </div>
          </section>
          <section class="panel">
            <h3>${allMode ? "Left across all tiers for" : "Left for (next counted tier)"}</h3>
            <div class="list">
              ${leftRows.length === 0 ? `<div class="card"><div class="row-sub">${leftEmptyText}</div></div>` : ""}
              ${leftRows.slice(0, allMode ? 8 : 6).map(([b, flow]) => `
                <div class="card">
                  <div class="row-main"><span class="glink" data-sel-guild="${b}">${guildIdentityHtml(b, { realmIfDuplicate: true })}</span><span>−${fmt(flow.n)}</span></div>
                  <div class="char-refs">${nameChips(flow, allMode ? 8 : 6)}</div>
                </div>`).join("")}
            </div>
          </section>
          <section class="panel">
            <h3>Mainstays (most tiers in this guild)</h3>
            <div class="char-refs">
              ${mainstays.map(([c, n]) => `
                ${characterRefHtml(c, { realmIfDuplicate: true, suffix: `${n}` })}`).join("")}
            </div>
          </section>`;
        bindInspectorActions();
      }

      function renderCharPanel(c) {
        const ch = M.chars[c];
        const tiersAttended = F.charTiers[c] || [];
        const career = [];
        const guildsSeen = new Set();
        for (const t of tiersAttended) {
          const td = F.tiers[t];
          const s = td.slotOf.get(c);
          career.push({ t, g: td.g[s], r: td.r[s], name: entityName(c, t), realm: entityRealm(c, t), classID: td.classID[s] });
          guildsSeen.add(td.g[s]);
        }
        const first = career.length ? M.tiers[career[0].t] : null;
        const last = career.length ? M.tiers[career[career.length - 1].t] : null;

        const memberCount = ch.memberIndexes?.length || 1;
        const classID = classIDForEntity(c);
        els.insTitle.textContent = ch.name;
        els.insSub.textContent = isAccountMode()
          ? `${fmt(memberCount)} linked ${memberCount === 1 ? "character" : "characters"} · ${fmt(tiersAttended.length)} tiers · ${fmt(guildsSeen.size)} guilds · ${fmt(ch.total)} report appearances`
          : `${realmLabel(ch.realm)} · ${CLASS_NAMES[classID] || "Unknown"} · ${fmt(tiersAttended.length)} tiers · ${fmt(guildsSeen.size)} guilds · ${fmt(ch.total)} report appearances`;

        const linkedCharacters = isAccountMode() && memberCount > 1
          ? `<section class="panel">
              <h3>Linked characters</h3>
              <div class="char-refs">
                ${ch.memberIndexes.map((member) => baseCharacterRefHtml(member)).join("")}
              </div>
            </section>`
          : "";

        els.insBody.innerHTML = `
          <section class="panel">
            <h3>Career ${first ? `· ${monthYear(first.start)} → ${monthYear(last.start)}` : ""}</h3>
            <div class="list">
              ${career.map((step) => `
                <button class="card ${step.t === view.tier ? "active" : ""}" type="button" data-go-tier="${step.t}">
                  <div class="row-main">
                    ${guildIdentityHtml(step.g, { realmIfDuplicate: true })}
                    <span style="color:${expColor(M.tiers[step.t].expansion)}">${tierAbbr(M.tiers[step.t].name)}</span>
                  </div>
                  <div class="row-sub">${esc(M.tiers[step.t].name)} · ${fmt(step.r)} reports${isAccountMode() ? ` · as ${esc(step.name)}-${esc(realmLabel(step.realm))} · ${esc(CLASS_NAMES[step.classID] || "Unknown")}` : ""}</div>
                </button>`).join("")}
            </div>
          </section>
          ${linkedCharacters}
          <section class="panel">
            <h3>Guilds</h3>
            <div class="chips">
              ${Array.from(guildsSeen).map((g) => `
                <span class="chip" data-sel-guild="${g}" style="border-color:hsl(${M.guilds[g].hue} 65% 58% / 0.6)">${esc(guildLabel(g))}</span>`).join("")}
            </div>
          </section>`;
        bindInspectorActions();
      }

      function selectGuild(g) {
        view.selGuild = g === LUMP ? -1 : g;
        view.selChar = -1;
        view.selMovement = -1;
        setInspectorOpen(true);
        renderInspector();
      }

      function selectChar(c) {
        view.selChar = c;
        view.selMovement = -1;
        view.selGuild = -1;
        setInspectorOpen(true);
        const tiersAttended = F.charTiers[c] || [];
        if (view.mode === "galaxy" && tiersAttended.length && !tiersAttended.includes(view.tier)) {
          stopPlay();
          setTier(tiersAttended[tiersAttended.length - 1]);
        }
        renderInspector();
      }

      function selectMovementEntity(entityIndex) {
        view.selMovement = entityIndex;
        view.selChar = -1;
        view.selGuild = -1;
        setInspectorOpen(true);
        const node = M.movementCurrent?.frame?.nodeByEntity?.get(entityIndex);
        if (node) panMovementTo(node.x, node.y);
        renderInspector();
      }

      function clearSelection() {
        view.selChar = -1;
        view.selMovement = -1;
        view.selGuild = -1;
        renderInspector();
      }

      /* ============================== sidebar widgets ============================== */

      function buildClassGrid() {
        if (!els.classGrid) return;
        els.classGrid.innerHTML = Object.entries(CLASS_NAMES)
          .map(([id, name]) => `
            <button class="class-chip" type="button" data-class="${id}">
              <span class="dot" style="background:${CLASS_COLORS[id]}"></span>${esc(name)}
            </button>`)
          .join("");
        for (const chip of els.classGrid.querySelectorAll("[data-class]")) {
          chip.addEventListener("click", () => {
            const id = Number(chip.dataset.class);
            if (view.classFilter.has(id)) view.classFilter.delete(id);
            else view.classFilter.add(id);
            chip.classList.toggle("on", view.classFilter.has(id));
          }, { signal: listenerSignal });
        }
      }

      function focusGuild(g) {
        view.selGuild = g;
        view.selChar = -1;
        view.selMovement = -1;
        setInspectorOpen(true);
        if (view.mode === "galaxy" && !F.tiers[view.tier].roster.has(g)) {
          for (let t = M.tiers.length - 1; t >= 0; t -= 1) {
            if (F.tiers[t].roster.has(g)) { stopPlay(); setTier(t); break; }
          }
        }
        if (view.mode === "all") {
          const at = buildAllTime();
          panTo(at.gx[g], at.gy[g]);
        } else if (view.mode === "movement") {
          const point = movementGuildPoint(M.movementCurrent, g);
          panMovementTo(point.x, point.y);
        } else if (view.mode !== "flow") {
          panTo(F.gx[g], F.gy[g]);
        }
        renderInspector();
      }

      let searchTimer = null;
      function runMovementSearch(q) {
        const derived = M.movementCurrent;
        if (!derived?.frame) {
          els.searchResults.classList.remove("visible");
          els.searchResults.innerHTML = "";
          return;
        }
        const hits = [];
        derived.entities.forEach((entity, entityIndex) => {
          if (!entity.searchKey.includes(q) || !derived.frame.nodeByEntity.has(entityIndex)) return;
          hits.push({
            type: "entity",
            id: entityIndex,
            score: normalizeSearch(entity.name).startsWith(q) ? 0 : 1,
            weight: entity.observations.length,
            label: entity.name,
          });
        });
        for (const [g, count] of derived.frame.guildActivity) {
          const guild = M.guilds[g];
          if (!guild.searchKey.includes(q)) continue;
          hits.push({
            type: "guild",
            id: g,
            score: guild.nameKey.startsWith(q) ? 0 : 1,
            weight: count,
            label: guild.name,
          });
        }
        hits.sort((a, b) => a.score - b.score || b.weight - a.weight || a.label.localeCompare(b.label));
        els.searchResults.innerHTML = hits.slice(0, 20).map((hit) => {
          if (hit.type === "guild") {
            const guild = M.guilds[hit.id];
            return `<button class="search-result" type="button" data-search-kind="movement-guild" data-search-id="${hit.id}">
              <div class="row-main">${guildIdentityHtml(hit.id, { color: `hsl(${guild.hue} 70% 72%)` })}<span class="search-kind guild">${esc(networkCopy.guild)}</span></div>
              <div class="row-sub">${esc(realmLabel(guild.realm))} · ${fmt(hit.weight)} ${esc(networkCopy.entitiesObserved.toLowerCase())}</div>
            </button>`;
          }
          const entity = derived.entities[hit.id];
          const node = derived.frame.nodeByEntity.get(hit.id);
          const classID = node?.classID || entity.classID || 0;
          return `<button class="search-result" type="button" data-search-kind="movement-entity" data-search-id="${hit.id}">
            <div class="row-main"><span style="color:${CLASS_COLORS[classID]}">${esc(entity.name)}</span><span class="search-kind">${esc(entity.isAccount ? networkCopy.account : networkCopy.character)}</span></div>
            <div class="row-sub">${fmt(hit.weight)} ${esc(networkCopy.reportObservations.toLowerCase())}${entity.isAccount ? ` · ${esc(networkCopy.inferredAccount)}` : ""}</div>
          </button>`;
        }).join("");
        els.searchResults.classList.toggle("visible", hits.length > 0);
        for (const button of els.searchResults.querySelectorAll("[data-search-kind]")) {
          button.addEventListener("click", () => {
            const id = Number(button.dataset.searchId);
            if (button.dataset.searchKind === "movement-guild") focusGuild(id);
            else selectMovementEntity(id);
            els.searchResults.classList.remove("visible");
          }, { signal: listenerSignal });
        }
      }

      function runSearch() {
        const q = normalizeSearch(els.search.value);
        if (q.length < 2) {
          els.searchResults.classList.remove("visible");
          els.searchResults.innerHTML = "";
          return;
        }
        if (view.mode === "movement") return runMovementSearch(q);
        const hits = [];
        for (let c = 0; c < M.chars.length; c += 1) {
          const ch = M.chars[c];
          if (!ch.searchKey.includes(q)) continue;
          const tiersAttended = (F.charTiers[c] || []).length;
          if (!tiersAttended) continue;
          hits.push({
            type: "char",
            id: c,
            score: ch.nameKey.startsWith(q) ? 0 : 1,
            weight: tiersAttended * 10000 + ch.total,
            label: ch.name,
            tiersAttended,
          });
        }
        for (let g = 0; g < M.guilds.length; g += 1) {
          if (F.guildMax[g] === 0) continue;
          const guild = M.guilds[g];
          if (!guild.searchKey.includes(q)) continue;
          let tiersActive = 0;
          for (let t = 0; t < M.tiers.length; t += 1) if (F.tiers[t].roster.has(g)) tiersActive += 1;
          hits.push({
            type: "guild",
            id: g,
            score: guild.nameKey.startsWith(q) ? 0 : 1,
            weight: F.guildMax[g] * 1000 + tiersActive,
            label: guild.name,
            tiersActive,
          });
        }
        hits.sort((a, b) => a.score - b.score || b.weight - a.weight || a.label.localeCompare(b.label));
        els.searchResults.innerHTML = hits.slice(0, 20)
          .map((hit) => {
            if (hit.type === "guild") {
              const g = hit.id;
              const guild = M.guilds[g];
              return `
                <button class="search-result" type="button" data-search-kind="guild" data-search-id="${g}">
                  <div class="row-main">
                    ${guildIdentityHtml(g, { color: `hsl(${guild.hue} 70% 72%)` })}
                    <span class="search-kind guild">Guild</span>
                  </div>
                  <div class="row-sub"><span class="realm-muted">${esc(realmLabel(guild.realm))}</span> · peak roster ${fmt(F.guildMax[g])} · active ${hit.tiersActive} ${hit.tiersActive === 1 ? "tier" : "tiers"}</div>
                </button>`;
            }
            const c = hit.id;
            const ch = M.chars[c];
            const classID = classIDForEntity(c);
            const memberCount = ch.memberIndexes?.length || 1;
            return `
              <button class="search-result" type="button" data-search-kind="char" data-search-id="${c}">
                <div class="row-main">
                  ${characterIdentityHtml(c, { color: CLASS_COLORS[classID] })}
                  <span class="search-kind">${isAccountMode() ? "Account" : "Character"}</span>
                </div>
                <div class="row-sub"><span class="realm-muted">${esc(realmLabel(entityRealm(c)))}</span> · ${esc(CLASS_NAMES[classID] || "Unknown")} · ${hit.tiersAttended} tiers · ${fmt(ch.total)} reports${isAccountMode() ? ` · ${fmt(memberCount)} linked ${memberCount === 1 ? "character" : "characters"}` : ""}</div>
              </button>`;
          })
          .join("");
        els.searchResults.classList.toggle("visible", hits.length > 0);
        for (const btn of els.searchResults.querySelectorAll("[data-search-kind]")) {
          btn.addEventListener("click", () => {
            const id = Number(btn.dataset.searchId);
            if (btn.dataset.searchKind === "guild") focusGuild(id);
            else selectChar(id);
            els.searchResults.classList.remove("visible");
          }, { signal: listenerSignal });
        }
      }

      /* ============================== galaxy rendering ============================== */

      function resizeCanvas() {
        const rect = stage.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.floor(rect.width * ratio));
        canvas.height = Math.max(1, Math.floor(rect.height * ratio));
        canvas.style.width = `${rect.width}px`;
        canvas.style.height = `${rect.height}px`;
      }

      function dotAlpha(c, g, classID) {
        let a = 0.92;
        if (view.classFilter.size && !view.classFilter.has(classID)) a *= 0.1;
        if (view.selGuild >= 0 && g !== view.selGuild) a *= 0.22;
        if (view.selChar >= 0) a *= c === view.selChar ? 1 : 0.1;
        return a;
      }

      function previousDotAlpha(c, g, current, classID) {
        const currentSlot = current.slotOf.get(c);
        let a = currentSlot === undefined ? 0.26 : current.g[currentSlot] === g ? 0.1 : 0.22;
        if (view.classFilter.size && !view.classFilter.has(classID)) a *= 0.12;
        if (view.selGuild >= 0 && g !== view.selGuild) a *= 0.18;
        if (view.selChar >= 0) a *= c === view.selChar ? 2.5 : 0.1;
        return Math.min(0.65, a);
      }

      function selectedCharacterGuilds() {
        if (view.mode === "movement" && view.selMovement >= 0) {
          const timeline = M.movementCurrent?.timelines?.[view.selMovement];
          if (!timeline) return null;
          const guilds = new Set();
          for (const item of timeline.visibleSequence) {
            if (item.start > M.movementCurrent.frame.cutoff) continue;
            if (item.kind === "stint") guilds.add(item.g);
            else for (const guild of item.guilds) guilds.add(guild.g);
          }
          return guilds;
        }
        if (view.selChar < 0) return null;
        const guilds = new Set();
        const tierList = F.charMovementTiers[view.selChar] || F.charTiers[view.selChar] || [];
        for (const tt of tierList) {
          const td = F.tiers[tt];
          const s = td.slotOf.get(view.selChar);
          if (s !== undefined) guilds.add(td.g[s]);
        }
        return guilds;
      }

      function hitGuildLabelAt(world, transform, g, x, y, fontPx) {
        const label = guildLabel(g);
        const pad = 5 / transform.k;
        ctx.font = `700 ${fontPx}px Inter, system-ui, sans-serif`;
        const width = ctx.measureText(label).width;
        return world.x >= x - width / 2 - pad &&
          world.x <= x + width / 2 + pad &&
          world.y >= y - fontPx - pad &&
          world.y <= y + pad;
      }

      function hitVisibleGalaxyLabel(world, transform, roster, positions, previous = false) {
        if (!view.showLabels) return null;
        const visibleGuilds = selectedCharacterGuilds();
        const fontPx = clamp((previous ? 10 : 11) / transform.k, 4, previous ? 180 : 200);
        for (const [g, n] of roster) {
          if (visibleGuilds && !visibleGuilds.has(g)) continue;
          const x = positions.gx[g];
          const y = positions.gy[g] - hullRadius(n) - 3 / transform.k;
          if (hitGuildLabelAt(world, transform, g, x, y, fontPx)) return g;
        }
        return null;
      }

      function hitVisibleAllLabel(world, transform, at) {
        if (!view.showLabels) return null;
        const visibleGuilds = selectedCharacterGuilds();
        const fontPx = clamp(11 / transform.k, 4, 200);
        for (const [g] of at.roster) {
          if (visibleGuilds && !visibleGuilds.has(g)) continue;
          const x = at.gx[g];
          const y = at.gy[g] - hullRadius(allTimeHullN(at, g)) - 3 / transform.k;
          if (hitGuildLabelAt(world, transform, g, x, y, fontPx)) return g;
        }
        return null;
      }

      function drawPreviousTierContext(t, current) {
        if (isMovementIgnoredTier(view.tier)) return;
        const prevTier = F.prevMovementTier[view.tier];
        if (prevTier < 0) return;
        const prev = F.tiers[prevTier];

        ctx.save();
        ctx.setLineDash([5 / t.k, 5 / t.k]);
        for (const [g, n] of prev.roster) {
          const isCurrent = current.roster.has(g);
          const isSel = g === view.selGuild;
          const isHover = view.hover && view.hover.kind === "guild" && view.hover.g === g;
          const r = hullRadius(n);
          ctx.beginPath();
          ctx.arc(F.gx[g], F.gy[g], r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(148, 163, 184, ${isSel || isHover ? 0.16 : isCurrent ? 0.045 : 0.085})`;
          ctx.fill();
          ctx.lineWidth = (isSel || isHover ? 1.5 : 0.9) / t.k;
          ctx.strokeStyle = `rgba(203, 213, 225, ${isSel || isHover ? 0.55 : isCurrent ? 0.18 : 0.32})`;
          ctx.stroke();
        }
        ctx.restore();

        const buckets = new Map();
        for (let s = 0; s < prev.count; s += 1) {
          const alpha = previousDotAlpha(prev.c[s], prev.g[s], current, prev.classID[s]);
          if (alpha < 0.02) continue;
          const bucket = Math.min(13, Math.max(1, Math.round(alpha * 20)));
          let path = buckets.get(bucket);
          if (!path) buckets.set(bucket, (path = new Path2D()));
          const r = 1.3 + Math.min(2, Math.sqrt(prev.r[s]) * 0.32);
          path.moveTo(prev.x[s] + r, prev.y[s]);
          path.arc(prev.x[s], prev.y[s], r, 0, Math.PI * 2);
        }
        for (const [bucket, path] of buckets) {
          ctx.globalAlpha = bucket / 20;
          ctx.fillStyle = "#94a3b8";
          ctx.fill(path);
        }
        ctx.globalAlpha = 1;

        if (!view.showLabels) return;
        const visibleGuilds = selectedCharacterGuilds();
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        for (const [g, n] of prev.roster) {
          if (current.roster.has(g)) continue;
          if (visibleGuilds && !visibleGuilds.has(g)) continue;
          const isSel = g === view.selGuild;
          const isHover = view.hover && view.hover.kind === "guild" && view.hover.g === g;
          const label = guildLabel(g);
          const fontPx = clamp(10 / t.k, 4, 180);
          const x = F.gx[g];
          const y = F.gy[g] - hullRadius(n) - 3 / t.k;
          ctx.font = `650 ${fontPx}px Inter, system-ui, sans-serif`;
          ctx.lineWidth = 3 / t.k;
          ctx.strokeStyle = "rgba(5, 7, 17, 0.85)";
          ctx.strokeText(label, x, y);
          ctx.fillStyle = isSel || isHover ? "#e2e8f0" : "rgba(203, 213, 225, 0.68)";
          ctx.fillText(label, x, y);
        }
      }

      function movementNodeAlpha(node) {
        let alpha = 0.92;
        if (view.classFilter.size && !view.classFilter.has(node.classID)) alpha *= 0.1;
        if (view.selGuild >= 0 && node.g !== view.selGuild && !node.guilds.includes(view.selGuild)) alpha *= 0.18;
        if (view.selMovement >= 0) alpha *= node.entityIndex === view.selMovement ? 1 : 0.1;
        return alpha;
      }

      function drawSelectedMovementPath(derived, t) {
        if (view.selMovement < 0) return;
        const timeline = derived.timelines[view.selMovement];
        const node = derived.frame.nodeByEntity.get(view.selMovement);
        if (!timeline || !node) return;
        const transitions = timeline.visibleTransitions.filter((transition) => transition.time <= derived.frame.cutoff);
        transitions.forEach((transition, index) => {
          const from = movementGuildPoint(derived, transition.from.g);
          const to = movementGuildPoint(derived, transition.to.g);
          const x0 = from.x;
          const y0 = from.y;
          const x1 = to.x;
          const y1 = to.y;
          const direction = index % 2 ? -1 : 1;
          const bend = 0.1 + Math.min(0.08, index * 0.012);
          const cx = (x0 + x1) / 2 - (y1 - y0) * bend * direction;
          const cy = (y0 + y1) / 2 + (x1 - x0) * bend * direction;
          ctx.beginPath();
          ctx.moveTo(x0, y0);
          ctx.quadraticCurveTo(cx, cy, x1, y1);
          ctx.strokeStyle = "rgba(251, 191, 36, 0.78)";
          ctx.lineWidth = 1.8 / Math.sqrt(t.k);
          ctx.stroke();
          drawQuadraticArrowheads(x0, y0, cx, cy, x1, y1, 3, 4 / Math.sqrt(t.k), "rgba(251, 191, 36, 0.9)");
        });

        const ambiguous = timeline.visibleSequence.filter((item) => item.kind === "ambiguous" && item.start <= derived.frame.cutoff);
        if (ambiguous.length) {
          ctx.save();
          ctx.setLineDash([4 / t.k, 4 / t.k]);
          ctx.lineWidth = 1 / t.k;
          ctx.strokeStyle = "rgba(251, 191, 36, 0.5)";
          for (const item of ambiguous) {
            let cx = 0;
            let cy = 0;
            for (const guild of item.guilds) {
              const point = movementGuildPoint(derived, guild.g);
              cx += point.x;
              cy += point.y;
            }
            cx /= item.guilds.length;
            cy /= item.guilds.length;
            for (const guild of item.guilds) {
              const point = movementGuildPoint(derived, guild.g);
              ctx.beginPath();
              ctx.moveTo(cx, cy);
              ctx.lineTo(point.x, point.y);
              ctx.stroke();
            }
          }
          ctx.restore();
        }

        ctx.beginPath();
        ctx.arc(node.x, node.y, 6 / Math.sqrt(t.k), 0, Math.PI * 2);
        ctx.strokeStyle = "#fbbf24";
        ctx.lineWidth = 1.8 / t.k;
        ctx.stroke();
      }

      function drawMovement() {
        const derived = M.movementCurrent;
        const frame = derived?.frame;
        if (!frame) return;
        const t = tf();
        ctx.save();
        ctx.translate(t.x, t.y);
        ctx.scale(t.k, t.k);

        for (const [g, n] of frame.guildActivity) {
          const r = hullRadius(n);
          const guild = M.guilds[g];
          const point = movementGuildPoint(derived, g);
          const selected = g === view.selGuild;
          const hovered = view.hover?.kind === "guild" && view.hover.g === g;
          ctx.beginPath();
          ctx.arc(point.x, point.y, r, 0, Math.PI * 2);
          ctx.fillStyle = `hsl(${guild.hue} 65% 58% / ${selected || hovered ? 0.16 : 0.07})`;
          ctx.fill();
          if (selected || hovered) {
            ctx.lineWidth = 1.6 / t.k;
            ctx.strokeStyle = `hsl(${guild.hue} 70% 65% / 0.8)`;
            ctx.stroke();
          }
        }

        if (view.showFlows) {
          for (const flow of frame.flows) {
            if (flow.a === flow.b) continue;
            const from = movementGuildPoint(derived, flow.a);
            const to = movementGuildPoint(derived, flow.b);
            const x0 = from.x;
            const y0 = from.y;
            const x1 = to.x;
            const y1 = to.y;
            const direction = flow.a < flow.b ? 1 : -1;
            const cx = (x0 + x1) / 2 - (y1 - y0) * 0.12 * direction;
            const cy = (y0 + y1) / 2 + (x1 - x0) * 0.12 * direction;
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.quadraticCurveTo(cx, cy, x1, y1);
            ctx.strokeStyle = `rgba(251, 191, 36, ${Math.min(0.56, 0.12 + flow.n * 0.035)})`;
            ctx.lineWidth = Math.min(7, 0.8 + Math.sqrt(flow.n));
            ctx.stroke();
            drawQuadraticArrowheads(
              x0,
              y0,
              cx,
              cy,
              x1,
              y1,
              clamp(Math.floor(Math.hypot(x1 - x0, y1 - y0) / 80), 2, 6),
              Math.min(12, 3.5 + Math.sqrt(flow.n) * 1.4),
              `rgba(251, 191, 36, ${Math.min(0.68, 0.22 + flow.n * 0.035)})`,
            );
          }
        }

        const buckets = new Map();
        for (const node of frame.nodes) {
          const alpha = movementNodeAlpha(node);
          if (alpha < 0.02) continue;
          const bucket = node.classID * 16 + Math.min(15, Math.round(alpha * 10));
          let path = buckets.get(bucket);
          if (!path) buckets.set(bucket, (path = new Path2D()));
          const reportCount = node.latestReportCount;
          const radius = 1.9 + Math.min(2.5, Math.sqrt(reportCount) * 0.45);
          path.moveTo(node.x + radius, node.y);
          path.arc(node.x, node.y, radius, 0, Math.PI * 2);
        }
        for (const [bucket, path] of buckets) {
          ctx.globalAlpha = (bucket % 16) / 10;
          ctx.fillStyle = CLASS_COLORS[Math.floor(bucket / 16)] || CLASS_COLORS[0];
          ctx.fill(path);
        }
        ctx.globalAlpha = 1;

        for (const node of frame.nodes) {
          if (node.g >= 0) continue;
          ctx.save();
          ctx.setLineDash([2.5 / t.k, 2.5 / t.k]);
          ctx.beginPath();
          ctx.arc(node.x, node.y, 5 / Math.sqrt(t.k), 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(251, 191, 36, 0.9)";
          ctx.lineWidth = 1.3 / t.k;
          ctx.stroke();
          ctx.restore();
        }

        drawSelectedMovementPath(derived, t);
        if (view.hover?.kind === "movementEntity") {
          const node = frame.nodeByEntity.get(view.hover.entityIndex);
          if (node) {
            ctx.beginPath();
            ctx.arc(node.x, node.y, 5 / Math.sqrt(t.k), 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(255,255,255,0.9)";
            ctx.lineWidth = 1.4 / t.k;
            ctx.stroke();
          }
        }
        if (view.showLabels) drawGuildLabels(t, frame.guildActivity, derived.guildLayout);
        ctx.restore();
      }

      function drawGalaxy(now) {
        const t = tf();
        const td = F.tiers[view.tier];
        const tier = M.tiers[view.tier];

        let p = 1;
        if (view.trans) {
          p = clamp((now - view.trans.start) / TRANS_MS, 0, 1);
          if (p >= 1) view.trans = null;
        }
        const pe = ease(p);

        ctx.save();
        ctx.translate(t.x, t.y);
        ctx.scale(t.k, t.k);

        drawPreviousTierContext(t, td);

        // guild hulls
        for (const [g, n] of td.roster) {
          const r = hullRadius(n);
          const guild = M.guilds[g];
          const isSel = g === view.selGuild;
          const isHover = view.hover && view.hover.kind === "guild" && view.hover.g === g;
          ctx.beginPath();
          ctx.arc(F.gx[g], F.gy[g], r, 0, Math.PI * 2);
          ctx.fillStyle = `hsl(${guild.hue} 65% 58% / ${isSel || isHover ? 0.16 : 0.07})`;
          ctx.fill();
          if (isSel || isHover) {
            ctx.lineWidth = 1.6 / t.k;
            ctx.strokeStyle = `hsl(${guild.hue} 70% 65% / 0.8)`;
            ctx.stroke();
          }
        }

        // aggregated migration arrows from the previous counted tier
        if (view.showFlows && F.flows[view.tier]) {
          for (const [key, flow] of F.flows[view.tier]) {
            const a = Math.floor(key / 100000);
            const b = key % 100000;
            const n = flow.n;
            if (a === b || n < 2) continue;
            const x0 = F.gx[a], y0 = F.gy[a], x1 = F.gx[b], y1 = F.gy[b];
            const mx = (x0 + x1) / 2 - (y1 - y0) * 0.14;
            const my = (y0 + y1) / 2 + (x1 - x0) * 0.14;
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.quadraticCurveTo(mx, my, x1, y1);
            ctx.strokeStyle = `rgba(251, 191, 36, ${Math.min(0.55, 0.1 + n * 0.03)})`;
            ctx.lineWidth = Math.min(7, 0.8 + Math.sqrt(n));
            ctx.stroke();
            const size = Math.min(14, 4 + Math.sqrt(n) * 1.6);
            const arrows = clamp(Math.floor(Math.hypot(x1 - x0, y1 - y0) / 70), 3, 8);
            drawQuadraticArrowheads(x0, y0, mx, my, x1, y1, arrows, size, `rgba(251, 191, 36, ${Math.min(0.62, 0.18 + n * 0.03)})`);
          }
        }

        // cross-guild fibers: characters who logged with several guilds in the same tier
        if (view.showFibers && td.secondaries.length) {
          ctx.beginPath();
          const cap = Math.min(td.secondaries.length, 7000);
          for (let i = 0; i < cap; i += 2) {
            const c = td.secondaries[i];
            const g = td.secondaries[i + 1];
            const s = td.slotOf.get(c);
            if (s === undefined) continue;
            ctx.moveTo(td.x[s], td.y[s]);
            ctx.lineTo(F.gx[g], F.gy[g]);
          }
          ctx.strokeStyle = "rgba(148, 163, 184, 0.07)";
          ctx.lineWidth = 0.7 / t.k;
          ctx.stroke();
        }

        // persistent per-character migration lines from the previous counted tier
        if (view.showTrails && view.tier > 0) {
          const lines = tierTrails(view.tier);
          if (lines.length) {
            const paths = new Map();
            for (const [x0, y0, x1, y1, c, classID] of lines) {
              const cls = classID;
              let path = paths.get(cls);
              if (!path) paths.set(cls, (path = new Path2D()));
              path.moveTo(x0, y0);
              path.lineTo(x1, y1);
            }
            ctx.globalAlpha = 0.3;
            ctx.lineWidth = 0.9 / Math.sqrt(t.k);
            for (const [cls, path] of paths) {
              ctx.strokeStyle = CLASS_COLORS[cls];
              ctx.stroke(path);
            }
            ctx.globalAlpha = 0.42;
            for (const [x0, y0, x1, y1, c, classID] of lines) {
              const len = Math.hypot(x1 - x0, y1 - y0);
              drawLineArrowheads(x0, y0, x1, y1, clamp(Math.floor(len / 42), 2, 6), 3.7 / Math.sqrt(t.k), CLASS_COLORS[classID]);
            }
            ctx.globalAlpha = 1;
          }
        }

        // leavers fade out where they last stood
        if (view.trans && view.trans.leavers.length) {
          const alpha = (1 - pe) * 0.5;
          if (alpha > 0.02) {
            const paths = new Map();
            for (const [x, y, c, classID] of view.trans.leavers) {
              const cls = classID;
              let path = paths.get(cls);
              if (!path) paths.set(cls, (path = new Path2D()));
              path.moveTo(x + 1.8, y);
              path.arc(x, y, 1.8, 0, Math.PI * 2);
            }
            ctx.globalAlpha = alpha;
            for (const [cls, path] of paths) {
              ctx.fillStyle = CLASS_COLORS[cls];
              ctx.fill(path);
            }
            ctx.globalAlpha = 1;
          }
        }

        // migration trails
        if (view.trans && view.trans.trails.length) {
          ctx.lineWidth = 1 / t.k;
          for (const [x0, y0, x1, y1, c, classID] of view.trans.trails) {
            const cx = x0 + (x1 - x0) * pe;
            const cy = y0 + (y1 - y0) * pe;
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(cx, cy);
            ctx.strokeStyle = CLASS_COLORS[classID] + "55";
            ctx.stroke();
            drawLineArrowheads(x0, y0, cx, cy, clamp(Math.floor(Math.hypot(cx - x0, cy - y0) / 38), 1, 5), 3.5 / Math.sqrt(t.k), CLASS_COLORS[classID] + "66");
          }
        }

        // character dots, batched by class × alpha bucket
        const buckets = new Map();
        const trans = view.trans;
        for (let s = 0; s < td.count; s += 1) {
          let x = td.x[s];
          let y = td.y[s];
          let alpha = dotAlpha(td.c[s], td.g[s], td.classID[s]);
          if (trans) {
            const px = trans.prevX[s];
            if (Number.isNaN(px)) {
              alpha *= pe; // newcomer fades in
            } else {
              x = px + (x - px) * pe;
              y = trans.prevY[s] + (y - trans.prevY[s]) * pe;
            }
          }
          if (alpha < 0.02) continue;
          const bucket = td.classID[s] * 16 + Math.min(15, Math.round(alpha * 10));
          let path = buckets.get(bucket);
          if (!path) buckets.set(bucket, (path = new Path2D()));
          const r = 1.7 + Math.min(2.4, Math.sqrt(td.r[s]) * 0.45);
          path.moveTo(x + r, y);
          path.arc(x, y, r, 0, Math.PI * 2);
        }
        for (const [bucket, path] of buckets) {
          ctx.globalAlpha = (bucket % 16) / 10;
          ctx.fillStyle = CLASS_COLORS[Math.floor(bucket / 16)];
          ctx.fill(path);
        }
        ctx.globalAlpha = 1;

        // selected character: career path through the constellation + ring
        if (view.selChar >= 0) drawCareerPath(view.selChar, t);

        // hovered character ring
        if (view.hover && view.hover.kind === "char") {
          const s = view.hover.s;
          ctx.beginPath();
          ctx.arc(td.x[s], td.y[s], 5, 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(255,255,255,0.9)";
          ctx.lineWidth = 1.4 / t.k;
          ctx.stroke();
        }

        // guild labels (always shown while the toggle is on)
        if (view.showLabels) drawGuildLabels(t, td.roster);

        // character names once zoomed in far enough to read them
        drawCharLabels(t, td);

        ctx.restore();
      }

      function drawGuildLabels(t, roster, positions = F) {
        const visibleGuilds = selectedCharacterGuilds();
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        for (const [g, n] of roster) {
          if (visibleGuilds && !visibleGuilds.has(g)) continue;
          const isSel = g === view.selGuild;
          const isHover = view.hover && (view.hover.kind === "guild") && view.hover.g === g;
          const guild = M.guilds[g];
          const label = guildLabel(g);
          const fontPx = clamp(11 / t.k, 4, 200);
          ctx.font = `700 ${fontPx}px Inter, system-ui, sans-serif`;
          const x = positions.gx[g];
          const y = positions.gy[g] - hullRadius(n) - 3 / t.k;
          ctx.lineWidth = 3 / t.k;
          ctx.strokeStyle = "rgba(5, 7, 17, 0.85)";
          ctx.strokeText(label, x, y);
          ctx.fillStyle = isSel || isHover ? "#fbbf24" : `hsl(${guild.hue} 70% 78%)`;
          ctx.fillText(label, x, y);
        }
      }

      function drawAllGuildLabels(t, at) {
        const visibleGuilds = selectedCharacterGuilds();
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        for (const [g] of at.roster) {
          if (visibleGuilds && !visibleGuilds.has(g)) continue;
          const isSel = g === view.selGuild;
          const isHover = view.hover && view.hover.kind === "guild" && view.hover.g === g;
          const guild = M.guilds[g];
          const label = guildLabel(g);
          const fontPx = clamp(11 / t.k, 4, 200);
          const x = at.gx[g];
          const y = at.gy[g] - hullRadius(allTimeHullN(at, g)) - 3 / t.k;
          ctx.font = `700 ${fontPx}px Inter, system-ui, sans-serif`;
          ctx.lineWidth = 3 / t.k;
          ctx.strokeStyle = "rgba(5, 7, 17, 0.85)";
          ctx.strokeText(label, x, y);
          ctx.fillStyle = isSel || isHover ? "#fbbf24" : `hsl(${guild.hue} 70% 78%)`;
          ctx.fillText(label, x, y);
        }
      }

      function drawCharLabels(t, src, minK = 3.2) {
        if (t.k < minK) return;
        const rect = stage.getBoundingClientRect();
        const wx0 = -t.x / t.k - 20;
        const wy0 = -t.y / t.k - 20;
        const wx1 = (rect.width - t.x) / t.k + 20;
        const wy1 = (rect.height - t.y) / t.k + 20;
        const fontPx = 10 / t.k;
        ctx.font = `600 ${fontPx}px Inter, system-ui, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        for (let s = 0; s < src.count; s += 1) {
          const x = src.x[s];
          const y = src.y[s];
          if (x < wx0 || x > wx1 || y < wy0 || y > wy1) continue;
          const label = slotLabel(src, s);
          ctx.lineWidth = 2.6 / t.k;
          ctx.strokeStyle = "rgba(5, 7, 17, 0.88)";
          ctx.strokeText(label, x, y + 3.4);
          ctx.fillStyle = CLASS_COLORS[slotClassID(src, s)];
          ctx.fillText(label, x, y + 3.4);
        }
      }

      function drawCareerPath(c, t) {
        const tiersAttended = F.charMovementTiers[c] || [];
        if (!tiersAttended.length) return;
