        const points = tiersAttended.map((tt) => {
          const td = F.tiers[tt];
          const s = td.slotOf.get(c);
          return { t: tt, x: td.x[s], y: td.y[s] };
        });

        ctx.lineWidth = 2.4 / Math.sqrt(t.k);
        for (let i = 1; i < points.length; i += 1) {
          const a = points[i - 1];
          const b = points[i];
          const gap = b.t - a.t > 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          const mx = (a.x + b.x) / 2 - (b.y - a.y) * 0.1;
          const my = (a.y + b.y) / 2 + (b.x - a.x) * 0.1;
          ctx.quadraticCurveTo(mx, my, b.x, b.y);
          ctx.setLineDash(gap ? [6 / t.k, 6 / t.k] : []);
          const hueShift = 30 + (i / points.length) * 30;
          ctx.strokeStyle = `hsl(${hueShift} 95% 62% / 0.9)`;
          ctx.stroke();
        }
        ctx.setLineDash([]);

        const fontPx = clamp(10 / t.k, 3, 60);
        ctx.font = `700 ${fontPx}px Inter, system-ui, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        for (const point of points) {
          const isCurrent = point.t === view.tier;
          ctx.beginPath();
          ctx.arc(point.x, point.y, (isCurrent ? 5 : 3.4) / Math.sqrt(t.k), 0, Math.PI * 2);
          ctx.fillStyle = isCurrent ? "#fbbf24" : "rgba(255,255,255,0.92)";
          ctx.fill();
          const label = tierAbbr(M.tiers[point.t].name);
          ctx.lineWidth = 3 / t.k;
          ctx.strokeStyle = "rgba(5, 7, 17, 0.85)";
          ctx.strokeText(label, point.x, point.y - 11 / t.k);
          ctx.fillStyle = "#fde68a";
          ctx.fillText(label, point.x, point.y - 11 / t.k);
        }
      }

      /* ============================== all-time rendering ============================== */

      function drawAll() {
        const t = tf();
        const at = buildAllTime();
        ctx.save();
        ctx.translate(t.x, t.y);
        ctx.scale(t.k, t.k);

        // guild hulls sized by loyalist core
        for (const [g] of at.roster) {
          const r = hullRadius(allTimeHullN(at, g));
          const guild = M.guilds[g];
          const isSel = g === view.selGuild;
          const isHover = view.hover && view.hover.kind === "guild" && view.hover.g === g;
          ctx.beginPath();
          ctx.arc(at.gx[g], at.gy[g], r, 0, Math.PI * 2);
          ctx.fillStyle = `hsl(${guild.hue} 65% 58% / ${isSel || isHover ? 0.16 : 0.07})`;
          ctx.fill();
          if (isSel || isHover) {
            ctx.lineWidth = 1.6 / t.k;
            ctx.strokeStyle = `hsl(${guild.hue} 70% 65% / 0.8)`;
            ctx.stroke();
          }
        }

        // career fibers: every multi-guild character tethered to each of their guilds
        if (view.showFibers && at.fibers.length) {
          for (let i = 0; i < at.fibers.length; i += 3) {
            const s = at.fibers[i];
            const g = at.fibers[i + 1];
            const reports = at.fibers[i + 2];
            const isSel = view.selGuild === g || view.selChar === at.c[s];
            ctx.beginPath();
            ctx.moveTo(at.x[s], at.y[s]);
            ctx.lineTo(at.gx[g], at.gy[g]);
            ctx.strokeStyle = isSel ? "rgba(251, 191, 36, 0.45)" : "rgba(148, 163, 184, 0.055)";
            ctx.lineWidth = (isSel ? 0.9 : 0.45) / t.k + Math.min(2.4, Math.sqrt(reports) * 0.08) / Math.sqrt(t.k);
            ctx.stroke();
          }
        }

        // membership mask so a selected guild keeps ALL its members lit, including
        // multi-guild characters whose primary guild is elsewhere
        let mask = null;
        if (view.selGuild >= 0) {
          if (at.selMaskG !== view.selGuild) {
            const m = new Uint8Array(at.count);
            for (let s = 0; s < at.count; s += 1) {
              const mem = M.chars[at.c[s]].mem;
              for (let i = 0; i < mem.length; i += 3) {
                if (mem[i + 1] === view.selGuild && mem[i + 2] >= view.minReports) { m[s] = 1; break; }
              }
            }
            at.selMask = m;
            at.selMaskG = view.selGuild;
          }
          mask = at.selMask;
        }

        // dots
        const buckets = new Map();
        for (let s = 0; s < at.count; s += 1) {
          const cls = at.classID[s];
          let alpha = 0.92;
          if (view.classFilter.size && !view.classFilter.has(cls)) alpha *= 0.1;
          if (mask && !mask[s]) alpha *= 0.22;
          if (view.selChar >= 0) alpha *= at.c[s] === view.selChar ? 1 : 0.1;
          if (alpha < 0.02) continue;
          const bucket = cls * 16 + Math.min(15, Math.round(alpha * 10));
          let path = buckets.get(bucket);
          if (!path) buckets.set(bucket, (path = new Path2D()));
          const r = 1.7 + Math.min(2.4, Math.sqrt(at.rep[s]) * 0.28);
          path.moveTo(at.x[s] + r, at.y[s]);
          path.arc(at.x[s], at.y[s], r, 0, Math.PI * 2);
        }
        for (const [bucket, path] of buckets) {
          ctx.globalAlpha = (bucket % 16) / 10;
          ctx.fillStyle = CLASS_COLORS[Math.floor(bucket / 16)];
          ctx.fill(path);
        }
        ctx.globalAlpha = 1;

        // selected character: amber tethers to every guild of their career
        if (view.selChar >= 0) {
          const s = at.slotOf.get(view.selChar);
          if (s !== undefined) {
            const mem = M.chars[view.selChar].mem;
            const seen = new Set();
            ctx.lineWidth = 1.8 / Math.sqrt(t.k);
            ctx.strokeStyle = "rgba(251, 191, 36, 0.85)";
            for (let i = 0; i < mem.length; i += 3) {
              const g = mem[i + 1];
              if (mem[i + 2] < view.minReports || seen.has(g)) continue;
              seen.add(g);
              ctx.beginPath();
              ctx.moveTo(at.x[s], at.y[s]);
              ctx.lineTo(at.gx[g], at.gy[g]);
              ctx.stroke();
            }
            ctx.beginPath();
            ctx.arc(at.x[s], at.y[s], 6 / Math.sqrt(t.k), 0, Math.PI * 2);
            ctx.strokeStyle = "#fbbf24";
            ctx.lineWidth = 2 / Math.sqrt(t.k);
            ctx.stroke();
          }
        }

        // hovered character ring
        if (view.hover && view.hover.kind === "char") {
          const s = view.hover.s;
          ctx.beginPath();
          ctx.arc(at.x[s], at.y[s], 5, 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(255,255,255,0.9)";
          ctx.lineWidth = 1.4 / t.k;
          ctx.stroke();
        }

        if (view.showLabels) drawAllGuildLabels(t, at);
        drawCharLabels(t, at, 4.2);

        ctx.restore();
      }

      function hitAll(px, py) {
        const at = buildAllTime();
        const world = toWorld(px, py);
        const transform = tf();
        const { cell, grid } = buildGrid(at);
        const reach = Math.max(6, 8 / transform.k);
        let best = null;
        let bestD = reach;
        const cx = Math.floor(world.x / cell);
        const cy = Math.floor(world.y / cell);
        for (let ix = cx - 1; ix <= cx + 1; ix += 1) {
          for (let iy = cy - 1; iy <= cy + 1; iy += 1) {
            const list = grid.get(`${ix}:${iy}`);
            if (!list) continue;
            for (const s of list) {
              const d = Math.hypot(world.x - at.x[s], world.y - at.y[s]);
              if (d < bestD) { bestD = d; best = s; }
            }
          }
        }
        if (best !== null) return { kind: "char", s: best, c: at.c[best], g: at.g[best] };

        const labelG = hitVisibleAllLabel(world, transform, at);
        if (labelG !== null) return { kind: "guild", g: labelG };

        let bestG = null;
        let bestGD = Infinity;
        for (const [g] of at.roster) {
          const d = Math.hypot(world.x - at.gx[g], world.y - at.gy[g]);
          if (d < hullRadius(allTimeHullN(at, g)) && d < bestGD) { bestGD = d; bestG = g; }
        }
        if (bestG !== null) return { kind: "guild", g: bestG };
        return null;
      }

      /* ============================== alluvial rendering ============================== */

      function flowColor(f, highlight) {
        if (highlight) return "rgba(251, 191, 36, 0.72)";
        if (f.a === f.b && f.a !== LUMP) {
          return `hsl(${M.guilds[f.a].hue} 60% 55% / 0.4)`;
        }
        if (f.a === f.b) return "rgba(148, 163, 184, 0.16)";
        return "rgba(148, 163, 184, 0.17)";
      }

      function drawFlow() {
        const t = tf();
        const { columns, flows } = F.alluvial;
        ctx.save();
        ctx.translate(t.x, t.y);
        ctx.scale(t.k, t.k);

        const selG = view.selGuild;
        const hover = view.hover;
        const selTiers = view.selChar >= 0 ? F.charMovementTiers[view.selChar] || [] : [];

        // ribbons
        for (let i = 1; i < columns.length; i += 1) {
          if (!flows[i]) continue;
          const sourceTier = flows[i][0]?.sourceTier ?? i - 1;
          const x0 = sourceTier * ALLUVIAL_COL_PITCH + ALLUVIAL_NODE_W;
          const x1 = i * ALLUVIAL_COL_PITCH;
          const cpx = (x1 - x0) * 0.45;
          for (const f of flows[i]) {
            const isSel = selG >= 0 && (f.a === selG || f.b === selG);
            const isHover = hover && hover.kind === "flow" && hover.f === f;
            ctx.beginPath();
            ctx.moveTo(x0, f.ya);
            ctx.bezierCurveTo(x0 + cpx, f.ya, x1 - cpx, f.yb, x1, f.yb);
            ctx.lineTo(x1, f.yb + f.w);
            ctx.bezierCurveTo(x1 - cpx, f.yb + f.w, x0 + cpx, f.ya + f.w, x0, f.ya + f.w);
            ctx.closePath();
            ctx.fillStyle = flowColor(f, isSel || isHover);
            ctx.fill();
          }
        }

        // nodes
        for (let i = 0; i < columns.length; i += 1) {
          const isCurrentTier = i === view.tier;
          for (const node of columns[i].nodes) {
            const isSel = node.g === selG;
            const isHover = hover && hover.kind === "node" && hover.node === node;
            const hue = node.g === LUMP ? null : M.guilds[node.g].hue;
            ctx.fillStyle = node.g === LUMP
              ? "rgba(115, 129, 150, 0.55)"
              : `hsl(${hue} 62% ${isSel || isHover ? 66 : 52}% / ${isSel || isHover ? 1 : 0.85})`;
            ctx.fillRect(node.x, node.y, ALLUVIAL_NODE_W, node.h);
            if (isSel) {
              ctx.lineWidth = 1.6 / t.k;
              ctx.strokeStyle = "#fbbf24";
              ctx.strokeRect(node.x, node.y, ALLUVIAL_NODE_W, node.h);
            }
            const apparentH = node.h * t.k;
            if ((apparentH > 9 || isSel || isHover) && node.g !== LUMP) {
              const fontPx = clamp(10.5 / t.k, 2.5, 80);
              ctx.font = `650 ${fontPx}px Inter, system-ui, sans-serif`;
              ctx.textAlign = "left";
              ctx.textBaseline = "middle";
              const label = M.guilds[node.g].name;
              ctx.lineWidth = 3 / t.k;
              ctx.strokeStyle = "rgba(5, 7, 17, 0.8)";
              ctx.strokeText(label, node.x + ALLUVIAL_NODE_W + 4 / t.k, node.y + node.h / 2);
              ctx.fillStyle = isSel || isHover ? "#fbbf24" : `hsl(${hue} 60% 78% / 0.9)`;
              ctx.fillText(label, node.x + ALLUVIAL_NODE_W + 4 / t.k, node.y + node.h / 2);
            }
          }
          // column header
          const tier = M.tiers[i];
          const fontPx = clamp(12 / t.k, 3, 90);
          ctx.font = `800 ${fontPx}px Inter, system-ui, sans-serif`;
          ctx.textAlign = "left";
          ctx.textBaseline = "bottom";
          const hx = i * ALLUVIAL_COL_PITCH;
          const hy = -18 / t.k;
          ctx.fillStyle = isCurrentTier ? "#fbbf24" : expColor(tier.expansion);
          ctx.fillText(tierAbbr(tier.name), hx, hy);
          ctx.font = `600 ${fontPx * 0.72}px Inter, system-ui, sans-serif`;
          ctx.fillStyle = "rgba(165, 180, 200, 0.75)";
          ctx.fillText(tier.start ? String(new Date(tier.start).getFullYear()) : "", hx, hy + fontPx * 0.85);
        }

        // selected character path across columns
        if (view.selChar >= 0 && selTiers.length) {
          ctx.beginPath();
          let started = false;
          for (const tt of selTiers) {
            const td = F.tiers[tt];
            const s = td.slotOf.get(view.selChar);
            const g = td.g[s];
            const node = columns[tt].byG.get((td.roster.get(g) || 0) >= ALLUVIAL_MIN_ROSTER ? g : LUMP);
            if (!node) continue;
            const x = node.x + ALLUVIAL_NODE_W / 2;
            const y = node.y + node.h / 2;
            if (started) ctx.lineTo(x, y); else { ctx.moveTo(x, y); started = true; }
          }
          ctx.strokeStyle = "rgba(251, 191, 36, 0.9)";
          ctx.lineWidth = 2.4 / t.k;
          ctx.stroke();
        }

        ctx.restore();
      }

      /* ============================== frame loop ============================== */

      function frame(now) {
        if (destroyed) return;
        const rect = stage.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        ctx.clearRect(0, 0, rect.width, rect.height);
        if (F.tiers) {
          if (view.mode === "galaxy") drawGalaxy(now);
          else if (view.mode === "movement") drawMovement();
          else if (view.mode === "all") drawAll();
          else drawFlow();
        }
        frameId = requestAnimationFrame(frame);
      }

      /* ============================== hit testing ============================== */

      function buildGrid(td) {
        if (td.grid) return td.grid;
        const cell = 22;
        const grid = new Map();
        for (let s = 0; s < td.count; s += 1) {
          const key = `${Math.floor(td.x[s] / cell)}:${Math.floor(td.y[s] / cell)}`;
          let list = grid.get(key);
          if (!list) grid.set(key, (list = []));
          list.push(s);
        }
        td.grid = { cell, grid };
        return td.grid;
      }

      function hitGalaxy(px, py) {
        const world = toWorld(px, py);
        const td = F.tiers[view.tier];
        const transform = tf();
        const { cell, grid } = buildGrid(td);
        const reach = Math.max(6, 8 / transform.k);
        let best = null;
        let bestD = reach;
        const cx = Math.floor(world.x / cell);
        const cy = Math.floor(world.y / cell);
        for (let ix = cx - 1; ix <= cx + 1; ix += 1) {
          for (let iy = cy - 1; iy <= cy + 1; iy += 1) {
            const list = grid.get(`${ix}:${iy}`);
            if (!list) continue;
            for (const s of list) {
              const d = Math.hypot(world.x - td.x[s], world.y - td.y[s]);
              if (d < bestD) { bestD = d; best = s; }
            }
          }
        }
        if (best !== null) return { kind: "char", s: best, c: td.c[best], g: td.g[best] };

        const labelG = hitVisibleGalaxyLabel(world, transform, td.roster, F);
        if (labelG !== null) return { kind: "guild", g: labelG };

        let bestG = null;
        let bestGD = Infinity;
        for (const [g, n] of td.roster) {
          const d = Math.hypot(world.x - F.gx[g], world.y - F.gy[g]);
          if (d < hullRadius(n) && d < bestGD) { bestGD = d; bestG = g; }
        }
        if (bestG !== null) return { kind: "guild", g: bestG };
        const prevTier = isMovementIgnoredTier(view.tier) ? -1 : F.prevMovementTier[view.tier];
        if (prevTier >= 0) {
          const prev = F.tiers[prevTier];
          const prevLabelG = hitVisibleGalaxyLabel(world, transform, Array.from(prev.roster).filter(([g]) => !td.roster.has(g)), F, true);
          if (prevLabelG !== null) return { kind: "guild", g: prevLabelG, previous: true };
          for (const [g, n] of prev.roster) {
            if (td.roster.has(g)) continue;
            const d = Math.hypot(world.x - F.gx[g], world.y - F.gy[g]);
            if (d < hullRadius(n) && d < bestGD) { bestGD = d; bestG = g; }
          }
          if (bestG !== null) return { kind: "guild", g: bestG, previous: true };
        }
        return null;
      }

      function buildMovementGrid(frame) {
        if (frame.grid) return frame.grid;
        const cell = 22;
        const grid = new Map();
        for (const node of frame.nodes) {
          const key = `${Math.floor(node.x / cell)}:${Math.floor(node.y / cell)}`;
          const list = grid.get(key) || [];
          list.push(node);
          grid.set(key, list);
        }
        frame.grid = { cell, grid };
        return frame.grid;
      }

      function hitMovement(px, py) {
        const derived = M.movementCurrent;
        const frame = derived?.frame;
        if (!frame) return null;
        const world = toWorld(px, py);
        const transform = tf();
        const { cell, grid } = buildMovementGrid(frame);
        const reach = Math.max(6, 8 / transform.k);
        let closest = null;
        let closestDistance = reach;
        const cx = Math.floor(world.x / cell);
        const cy = Math.floor(world.y / cell);
        for (let ix = cx - 1; ix <= cx + 1; ix += 1) {
          for (let iy = cy - 1; iy <= cy + 1; iy += 1) {
            for (const node of grid.get(`${ix}:${iy}`) || []) {
              const distance = Math.hypot(world.x - node.x, world.y - node.y);
              if (distance < closestDistance) {
                closest = node;
                closestDistance = distance;
              }
            }
          }
        }
        if (closest) return { kind: "movementEntity", entityIndex: closest.entityIndex, node: closest };

        const labelG = hitVisibleGalaxyLabel(world, transform, frame.guildActivity, derived.guildLayout);
        if (labelG !== null) return { kind: "guild", g: labelG };
        let bestGuild = null;
        let bestGuildDistance = Infinity;
        for (const [g, n] of frame.guildActivity) {
          const point = movementGuildPoint(derived, g);
          const distance = Math.hypot(world.x - point.x, world.y - point.y);
          if (distance < hullRadius(n) && distance < bestGuildDistance) {
            bestGuild = g;
            bestGuildDistance = distance;
          }
        }
        if (bestGuild !== null) return { kind: "guild", g: bestGuild };

        if (view.showFlows) {
          let bestFlow = null;
          let bestFlowDistance = 8 / transform.k;
          for (const flow of frame.flows) {
            const from = movementGuildPoint(derived, flow.a);
            const to = movementGuildPoint(derived, flow.b);
            const x0 = from.x;
            const y0 = from.y;
            const x1 = to.x;
            const y1 = to.y;
            const direction = flow.a < flow.b ? 1 : -1;
            const curveX = (x0 + x1) / 2 - (y1 - y0) * 0.12 * direction;
            const curveY = (y0 + y1) / 2 + (x1 - x0) * 0.12 * direction;
            for (let sample = 0; sample <= 20; sample += 1) {
              const point = quadraticPoint(x0, y0, curveX, curveY, x1, y1, sample / 20);
              const distance = Math.hypot(world.x - point.x, world.y - point.y);
              if (distance < bestFlowDistance) {
                bestFlowDistance = distance;
                bestFlow = flow;
              }
            }
          }
          if (bestFlow) return { kind: "movementFlow", flow: bestFlow };
        }
        return null;
      }

      function hitFlow(px, py) {
        const world = toWorld(px, py);
        const { columns, flows } = F.alluvial;
        const col = Math.round(world.x / ALLUVIAL_COL_PITCH);

        // headers
        if (world.y < -6 && col >= 0 && col < columns.length && Math.abs(world.x - col * ALLUVIAL_COL_PITCH) < 90) {
          return { kind: "header", t: col };
        }

        // nodes
        const colIdx = Math.floor((world.x + 40) / ALLUVIAL_COL_PITCH);
        for (const i of [colIdx, colIdx + 1]) {
          if (i < 0 || i >= columns.length) continue;
          if (world.x >= i * ALLUVIAL_COL_PITCH - 2 && world.x <= i * ALLUVIAL_COL_PITCH + ALLUVIAL_NODE_W + 2) {
            for (const node of columns[i].nodes) {
              if (world.y >= node.y - 1 && world.y <= node.y + node.h + 1) return { kind: "node", node, t: i };
            }
          }
        }

        // ribbons
        for (let target = 1; target < columns.length; target += 1) {
          const list = flows[target];
          if (!list) continue;
          const sourceTier = list[0]?.sourceTier ?? target - 1;
          const x0 = sourceTier * ALLUVIAL_COL_PITCH + ALLUVIAL_NODE_W;
          const x1 = target * ALLUVIAL_COL_PITCH;
          if (world.x > x0 && world.x < x1) {
            const u = (world.x - x0) / (x1 - x0);
            const su = u * u * (3 - 2 * u);
            let best = null;
            for (const f of list) {
              const yTop = f.ya + (f.yb - f.ya) * su;
              if (world.y >= yTop - 1 && world.y <= yTop + f.w + 1) {
                if (!best || f.w < best.w) best = f;
              }
            }
            if (best) return { kind: "flow", f: best, t: target };
          }
        }
        return null;
      }

      /* ============================== tooltip ============================== */

      function showTooltip(px, py, html) {
        tooltip.innerHTML = html;
        tooltip.style.display = "block";
        const rect = stage.getBoundingClientRect();
        const tw = tooltip.offsetWidth;
        const th = tooltip.offsetHeight;
        tooltip.style.left = `${clamp(px + 16, 4, rect.width - tw - 6)}px`;
        tooltip.style.top = `${clamp(py + 14, 4, rect.height - th - 6)}px`;
      }

      function hideTooltip() {
        tooltip.style.display = "none";
      }

      function flowNames(f, max = 8) {
        const names = (f.cs || []).slice(0, max).map((c) => characterLabel(c)).join(", ");
        if (!names) return "";
        const extra = f.n - Math.min(f.cs.length, max);
        return `<br><span style="color:#cbd5e1">${esc(names)}${extra > 0 ? ` +${fmt(extra)} more` : ""}</span>`;
      }

      function tooltipFor(hit) {
        if (hit.kind === "movementEntity") {
          const derived = M.movementCurrent;
          const entity = derived.entities[hit.entityIndex];
          const node = hit.node;
          const classID = node.classID || entity.classID || 0;
          const guildText = node.g >= 0
            ? guildLabel(node.g)
            : node.guilds.map((g) => guildLabel(g)).join(" / ");
          const latestCount = node.latestReportCount;
          const altIndex = node.observation?.altIndexes?.[0];
          const altText = entity.isAccount && altIndex !== undefined
            ? `<br>${esc(networkCopy.responsibleAlt)} ${esc(movementCharacterLabel(derived.model, altIndex, true))}`
            : "";
          return `<b style="color:${CLASS_COLORS[classID] || CLASS_COLORS[0]}">${esc(entity.name)}</b><br>
            ${esc(guildText)} · ${esc(reportCountLabel(latestCount))}${altText}<br>
            ${node.g < 0 ? esc(networkCopy.ambiguousBody) : esc(networkCopy.clickMovementEntity)}`;
        }
        if (hit.kind === "movementFlow") {
          return `<b>${esc(guildLabel(hit.flow.a))} → ${esc(guildLabel(hit.flow.b))}</b><br>
            ${fmt(hit.flow.n)} ${esc(networkCopy.observedChanges.toLowerCase())}`;
        }
        if (hit.kind === "char") {
          const ch = M.chars[hit.c];
          const tiersAttended = ((view.mode === "all" ? F.charMovementTiers[hit.c] : F.charTiers[hit.c]) || []).length;
          if (view.mode === "all") {
            const at = F.allTime;
            const classID = at.classID[hit.s];
            return `<b style="color:${CLASS_COLORS[classID]}">${esc(characterLabel(hit.c))}</b><br>
              ${esc(CLASS_NAMES[classID] || "Unknown")} · main guild ${esc(guildLabel(hit.g))}<br>
              ${fmt(at.rep[hit.s])} reports across ${fmt(at.guildN[hit.s])} ${at.guildN[hit.s] === 1 ? "guild" : "guilds"} · ${tiersAttended} tiers · click for career`;
          }
          const td = F.tiers[view.tier];
          const reports = td.r[hit.s];
          const classID = td.classID[hit.s];
          const accountLine = isAccountMode() && ch.isAccount ? `<br>Account ${esc(ch.name)}` : "";
          return `<b style="color:${CLASS_COLORS[classID]}">${esc(characterLabel(hit.c, {}, view.tier))}</b><br>
            ${esc(CLASS_NAMES[classID] || "Unknown")} · ${esc(guildLabel(hit.g))}${accountLine}<br>
            ${fmt(reports)} reports this tier · ${tiersAttended} tiers tracked · click for career`;
        }
        if (hit.kind === "guild") {
          if (view.mode === "movement") {
            const count = M.movementCurrent?.frame?.roster?.get(hit.g) || 0;
            return `<b>${esc(guildLabel(hit.g))}</b><br>${fmt(count)} ${esc(networkCopy.entitiesObserved.toLowerCase())} · ${esc(networkCopy.clickMovementEntity)}`;
          }
          if (view.mode === "all") {
            const at = F.allTime;
            return `<b>${esc(guildLabel(hit.g))}</b><br>${fmt(at.roster.get(hit.g) || 0)} distinct ${entityPlural()} all time · click to inspect`;
          }
          const n = F.tiers[view.tier].roster.get(hit.g) || 0;
          const prevTier = F.prevMovementTier?.[view.tier] ?? -1;
          if (!n && hit.previous && prevTier >= 0) {
            const prev = F.tiers[prevTier];
            const prevN = prev.roster.get(hit.g) || 0;
            return `<b>${esc(guildLabel(hit.g))}</b><br>${fmt(prevN)} ${entityPlural()} in previous counted tier · click to inspect`;
          }
          return `<b>${esc(guildLabel(hit.g))}</b><br>${fmt(n)} ${entityPlural()} this tier · click to inspect`;
        }
        if (hit.kind === "node") {
          return `<b>${esc(guildLabel(hit.node.g))}</b><br>${fmt(hit.node.count)} ${entityPlural()} in ${esc(M.tiers[hit.t].name)}`;
        }
        if (hit.kind === "flow") {
          const f = hit.f;
          const from = M.tiers[f.sourceTier ?? hit.t - 1];
          const to = M.tiers[hit.t];
          if (f.a === f.b) {
            return `<b>${esc(guildLabel(f.a))}</b><br>${fmt(f.n)} ${entityPlural()} stayed from ${esc(tierAbbr(from.name))} to ${esc(tierAbbr(to.name))}${flowNames(f)}`;
          }
          return `<b>${esc(guildLabel(f.a))} → ${esc(guildLabel(f.b))}</b><br>${fmt(f.n)} ${entityPlural()} moved between ${esc(tierAbbr(from.name))} and ${esc(tierAbbr(to.name))}${flowNames(f)}`;
        }
        if (hit.kind === "header") {
          return `<b>${esc(M.tiers[hit.t].name)}</b><br>${esc(M.tiers[hit.t].expansion)} · click to set current tier`;
        }
        return "";
      }

      /* ============================== pointer interactions ============================== */

      const pointer = { down: false, moved: false, x: 0, y: 0 };

      canvas.addEventListener("pointerdown", (event) => {
        const rect = canvas.getBoundingClientRect();
        pointer.down = true;
        pointer.moved = false;
        pointer.x = event.clientX - rect.left;
        pointer.y = event.clientY - rect.top;
        canvas.setPointerCapture(event.pointerId);
      }, { signal: listenerSignal });

      canvas.addEventListener("pointermove", (event) => {
        const rect = canvas.getBoundingClientRect();
        const px = event.clientX - rect.left;
        const py = event.clientY - rect.top;
        if (pointer.down) {
          const dx = px - pointer.x;
          const dy = py - pointer.y;
          if (Math.abs(dx) + Math.abs(dy) > 3) pointer.moved = true;
          if (pointer.moved) {
            tf().x += dx;
            tf().y += dy;
            hideTooltip();
          }
          pointer.x = px;
          pointer.y = py;
          return;
        }
        if (!F.tiers) return;
        const hit = view.mode === "galaxy"
          ? hitGalaxy(px, py)
          : view.mode === "movement"
            ? hitMovement(px, py)
            : view.mode === "all"
              ? hitAll(px, py)
              : hitFlow(px, py);
        view.hover = hit;
        canvas.style.cursor = hit ? "pointer" : "default";
        if (hit) showTooltip(px, py, tooltipFor(hit));
        else hideTooltip();
      }, { signal: listenerSignal });

      canvas.addEventListener("pointerup", (event) => {
        const wasDrag = pointer.moved;
        pointer.down = false;
        try { canvas.releasePointerCapture(event.pointerId); } catch {}
        if (wasDrag || !F.tiers) return;

        const rect = canvas.getBoundingClientRect();
        const px = event.clientX - rect.left;
        const py = event.clientY - rect.top;
        const hit = view.mode === "galaxy"
          ? hitGalaxy(px, py)
          : view.mode === "movement"
            ? hitMovement(px, py)
            : view.mode === "all"
              ? hitAll(px, py)
              : hitFlow(px, py);
        if (!hit) { clearSelection(); return; }
        if (hit.kind === "char") selectChar(hit.c);
        else if (hit.kind === "movementEntity") selectMovementEntity(hit.entityIndex);
        else if (hit.kind === "movementFlow") selectGuild(hit.flow.b);
        else if (hit.kind === "guild") selectGuild(hit.g);
        else if (hit.kind === "node") selectGuild(hit.node.g);
        else if (hit.kind === "header") { stopPlay(); setTier(hit.t, false); }
        else if (hit.kind === "flow" && hit.f.a !== LUMP) selectGuild(hit.f.a === hit.f.b ? hit.f.a : hit.f.b);
      }, { signal: listenerSignal });

      canvas.addEventListener("wheel", (event) => {
        event.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const px = event.clientX - rect.left;
        const py = event.clientY - rect.top;
        const t = tf();
        const before = toWorld(px, py);
        const factor = event.deltaY > 0 ? 0.88 : 1.14;
        t.k = clamp(t.k * factor, 0.015, 6);
        t.x = px - before.x * t.k;
        t.y = py - before.y * t.k;
        hideTooltip();
      }, { passive: false, signal: listenerSignal });

      /* ============================== top-level events ============================== */

      function updateIdentityButtons() {
        const hasAccounts = M.accountGroups.length > 0;
        setPressed(els.identityCharacter, view.identity === "character");
        setPressed(els.identityAccount, view.identity === "account");
        els.identityAccount.disabled = !hasAccounts;
        els.identityAccount.title = networkCopy.accounts;
        els.search.placeholder = hasAccounts ? networkCopy.searchAllPlaceholder : networkCopy.searchCharacterPlaceholder;
        if (view.mode === "movement") els.insSub.textContent = networkCopy.clickMovementEntity;
      }

      function setIdentity(identity) {
        if (identity === view.identity) return;
        if (identity === "account" && !M.accountGroups.length) return;
        stopPlay();
        view.identity = identity;
        view.selChar = -1;
        view.selMovement = -1;
        view.selGuild = -1;
        view.hover = null;
        view.trans = null;
        M.chars = identity === "account" ? buildAccountEntities() : M.baseChars;
        view.fitted = { galaxy: false, movement: false, all: false, flow: false };
        F.allTime = null;
        els.loadingTitle.textContent = view.mode === "movement" ? networkCopy.loadingMovementTitle : networkCopy.loadingUniverseTitle;
        els.loadingText.textContent = networkCopy.loadingLayout;
        els.loading.classList.add("visible");
        defer(() => {
          rebuild();
          updateIdentityButtons();
          if (view.mode === "movement") {
            const model = M.movement.get(M.tiers[view.tier].id);
            if (model) {
              activateMovementModel(model, false);
              els.loading.classList.remove("visible");
            } else {
              loadMovementForTier(view.tier, false);
            }
            return;
          }
          if (view.mode === "galaxy") fitGalaxy();
          else if (view.mode === "all") fitAll();
          else fitFlow();
          updateHud();
          renderInspector();
          runSearch();
          els.loading.classList.remove("visible");
        }, 30);
      }

      function setMode(mode) {
        if (mode === "movement" && !movementReady) return;
        if (mode === view.mode) return;
        stopPlay();
        view.mode = mode;
        view.selChar = -1;
        view.selMovement = -1;
        view.selGuild = -1;
        if (mode !== "movement" && movementController) {
          movementController.abort();
          movementController = null;
          els.loading.classList.remove("visible");
        }
        setPressed(els.modeGalaxy, mode === "galaxy");
        setPressed(els.modeMovement, mode === "movement");
        setPressed(els.modeAll, mode === "all");
        setPressed(els.modeFlow, mode === "flow");
        els.timeline.classList.toggle("dimmed", mode === "all");
        updateFilterControls();
        if (mode === "flow" && !view.fitted.flow) fitFlow();
        if (mode === "all" && !view.fitted.all) fitAll();
        if (mode === "galaxy" && !view.fitted.galaxy) fitGalaxy();
        if (mode === "movement") {
          M.movementCurrent = null;
          view.movementStep = -1;
          loadMovementForTier(view.tier);
        }
        view.hover = null;
        hideTooltip();
        buildTimeline();
        updateHud();
        renderInspector();
        runSearch();
      }

      els.modeGalaxy.addEventListener("click", () => setMode("galaxy"), { signal: listenerSignal });
      els.modeMovement.addEventListener("click", () => setMode("movement"), { signal: listenerSignal });
      els.modeAll.addEventListener("click", () => setMode("all"), { signal: listenerSignal });
      els.modeFlow.addEventListener("click", () => setMode("flow"), { signal: listenerSignal });
      els.identityCharacter.addEventListener("click", () => setIdentity("character"), { signal: listenerSignal });
      els.identityAccount.addEventListener("click", () => setIdentity("account"), { signal: listenerSignal });

      els.minReports.addEventListener("change", () => {
        if (view.mode === "movement") {
          view.movementMinReports = Number(els.minReports.value);
          const model = M.movement.get(M.tiers[view.tier].id);
          if (model) activateMovementModel(model, false);
          return;
        }
        view.minReports = Number(els.minReports.value);
        els.loadingTitle.textContent = networkCopy.loadingUniverseTitle;
        els.loadingText.textContent = networkCopy.recomputing;
        els.loading.classList.add("visible");
        defer(() => {
          rebuild();
          view.fitted.galaxy = false;
          view.fitted.movement = false;
          view.fitted.all = false;
          view.fitted.flow = false;
          if (view.mode === "galaxy") fitGalaxy();
          else if (view.mode === "all") fitAll();
          else fitFlow();
          els.loading.classList.remove("visible");
          updateHud();
          renderInspector();
          runSearch();
        }, 30);
      }, { signal: listenerSignal });

      els.tglFlows.addEventListener("change", () => { view.showFlows = els.tglFlows.checked; }, { signal: listenerSignal });
      els.tglTrails.addEventListener("change", () => { view.showTrails = els.tglTrails.checked; }, { signal: listenerSignal });
      els.tglFibers.addEventListener("change", () => { view.showFibers = els.tglFibers.checked; }, { signal: listenerSignal });
      els.tglLabels.addEventListener("change", () => { view.showLabels = els.tglLabels.checked; }, { signal: listenerSignal });

      els.search.addEventListener("input", () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(runSearch, 160);
      }, { signal: listenerSignal });

      els.resetView.addEventListener("click", () => {
        if (view.mode === "galaxy") fitGalaxy();
        else if (view.mode === "movement") fitMovement();
        else if (view.mode === "all") fitAll();
        else fitFlow();
      }, { signal: listenerSignal });
      els.clearSel.addEventListener("click", clearSelection, { signal: listenerSignal });
      els.playBtn.addEventListener("click", () => {
        if (view.playing) stopPlay();
        else startPlay();
      }, { signal: listenerSignal });

      window.addEventListener("keydown", (event) => {
        if (event.target instanceof HTMLInputElement || event.target instanceof HTMLSelectElement) return;
        if (event.key === "ArrowRight") {
          stopPlay();
          if (view.mode === "movement") setMovementStep(view.movementStep + 1);
          else moveToAdjacentMovementTier(1);
        }
        else if (event.key === "ArrowLeft") {
          stopPlay();
          if (view.mode === "movement") setMovementStep(view.movementStep - 1);
          else moveToAdjacentMovementTier(-1);
        }
        else if (event.key === " ") { event.preventDefault(); view.playing ? stopPlay() : startPlay(); }
        else if (event.key === "Escape") clearSelection();
      }, { signal: listenerSignal });

      window.addEventListener("resize", resizeCanvas, { signal: listenerSignal });
      if ("ResizeObserver" in window) {
        resizeObserver = new ResizeObserver(resizeCanvas);
        resizeObserver.observe(stage);
      }

      function destroy() {
        if (destroyed) return;
        destroyed = true;
        listenerController.abort();
        if (universeController) universeController.abort();
        if (movementController) movementController.abort();
        if (frameId !== null) {
          cancelAnimationFrame(frameId);
          frameId = null;
        }
        stopPlay();
        if (searchTimer) {
          clearTimeout(searchTimer);
          searchTimer = null;
        }
        for (const timer of pendingTimers) clearTimeout(timer);
        pendingTimers.clear();
        if (resizeObserver) {
          resizeObserver.disconnect();
          resizeObserver = null;
        }
        view.hover = null;
        view.trans = null;
        view.classFilter.clear();
        M.tiers = [];
        M.realms = [];
        M.guilds = [];
        M.baseChars = [];
        M.chars = [];
        M.accountGroups = [];
        M.accountChars = null;
        M.movement.clear();
        M.movementCurrent = null;
        for (const key of Object.keys(F)) delete F[key];
        canvas.width = 1;
        canvas.height = 1;
      }

      window.addEventListener("pagehide", (event) => {
        if (!event.persisted) destroy();
      }, { signal: listenerSignal });

      applyStaticCopy();
      resizeCanvas();
      boot();
    </script>
  </body>
</html>
