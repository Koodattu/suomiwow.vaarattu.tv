gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;

# Only Cloudflare peers may supply the client address. Review these ranges against
# https://www.cloudflare.com/ips-v4/ and https://www.cloudflare.com/ips-v6/ (2026-11-25).
real_ip_header CF-Connecting-IP;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Keep the TCP peer for attribution after real-IP restoration. The final field
# is the normalized client address for both proxied and direct requests.
log_format suomiwow '$realip_remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" "$remote_addr"';

# Match normalized paths only. Query values and ordinary application routes pass through.
map $uri $obvious_probe {
    default 0;
    ~*/\.git(?:/|$) 1;
    ~*/\.env(?:[./]|$) 1;
    ~*^/(?:wp-admin|phpmyadmin|cgi-bin)(?:/|$) 1;
    ~*^/(?:wp-login|xmlrpc)\.php(?:/|$) 1;
}

# Resolve Docker service names at runtime so nginx can start while application
# containers are stopped and reconnect when they return.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream frontend_upstream {
    zone frontend_upstream 64k;
    server frontend:3000 resolve;
}

upstream backend_upstream {
    zone backend_upstream 64k;
    server backend:3001 resolve;
}

upstream backend_worker_upstream {
    zone backend_worker_upstream 64k;
    server backend-worker:3002 resolve;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name suomiwow.vaarattu.tv;
    access_log /var/log/nginx/access.log suomiwow;

    if ($obvious_probe) { return 404; }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name suomiwow.vaarattu.tv;
    access_log /var/log/nginx/access.log suomiwow;
    ssl_certificate /etc/letsencrypt/live/suomiwow.vaarattu.tv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suomiwow.vaarattu.tv/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    if ($obvious_probe) { return 404; }

    # Express trusts its immediate proxy. Replace any inbound forwarded chain.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy no-referrer-when-downgrade;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy frontend
    location / {
        proxy_pass http://frontend_upstream;
        proxy_connect_timeout 2s;
        error_page 502 =503 /maintenance.html;
    }

    location = /maintenance.html {
        internal;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After 60 always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location ^~ /_next/static/ {
        proxy_pass http://frontend_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /icons/ {
        proxy_pass http://frontend_upstream;
        proxy_intercept_errors on;
        error_page 404 = @backend_icons;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location @backend_icons {
        proxy_pass http://backend_upstream;
        proxy_intercept_errors on;
        error_page 404 = @icon_not_found;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location @icon_not_found {
        add_header Cache-Control "no-store, max-age=0" always;
        return 404;
    }

    # Admin trigger endpoints → worker process (heavy computation)
    # These run stats recalculation, cache warming, etc. that would block the API
    location /api/admin/trigger/ {
        proxy_pass http://backend_worker_upstream;

        # Admin triggers can take a long time — don't timeout
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Mythic+ processor state is process-local, so status must come from the worker.
    location = /api/admin/mythic-plus-crawler/status {
        proxy_pass http://backend_worker_upstream;
    }

    # Character ranking processor state is process-local, so status must come from the worker.
    location = /api/admin/character-ranking-backfill/status {
        proxy_pass http://backend_worker_upstream;
    }

    # WCL identity audit state is process-local, so status must come from the worker.
    location = /api/admin/character-wcl-identity-audit/status {
        proxy_pass http://backend_worker_upstream;
    }

    # CCG media discovery and queue controls belong to the background worker.
    # Routing status here also reports the actual media processor state.
    location /api/admin/ccg/media/ {
        proxy_pass http://backend_worker_upstream;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Per-guild heavy operations → worker process
    location ~ ^/api/admin/guilds/[^/]+/(recalculate-stats|update-world-ranks)$ {
        proxy_pass http://backend_worker_upstream;
        proxy_read_timeout 600s;
    }

    # All public API calls pass through backend request analytics. Image APIs
    # are then forwarded internally to their Next.js handlers.
    location /api/ {
        proxy_pass http://backend_upstream;
    }

    location ^~ /api/ccg/studio/media/ {
        client_max_body_size 8m;
        proxy_read_timeout 120s;
        proxy_pass http://backend_upstream;
    }

}
